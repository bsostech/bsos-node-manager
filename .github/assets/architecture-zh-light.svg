<svg viewBox="0 0 720 780" role="img" aria-label="平台與節點的架構：瀏覽器以 HTTPS 443 連平台伺服器；平台主機上有平台伺服器、PostgreSQL、Prometheus、Alertmanager；每台節點主機的 agent 以 mTLS 撥出到平台 8443，並在本機讀 Besu 的 RPC、metrics 與日誌；Besu 以 P2P 30303 連到其他單位的節點。" xmlns="http://www.w3.org/2000/svg" width="720" height="780" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif"><defs style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"><path d="M0 1 L9 5 L0 9 z" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></path></marker><marker id="arch-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse" style="fill:rgb(0, 0, 0);stroke:none;stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"><path d="M0 1 L9 5 L0 9 z" style="fill:rgb(40, 127, 124);stroke:none;stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></path></marker></defs><!-- Browser --><rect x="250" y="16" width="220" height="64" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="360" y="44" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:17px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">瀏覽器</text><text x="360" y="66" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">維運 · 檢視 · 管理員</text><text x="372" y="112" style="fill:rgb(69, 75, 83);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">HTTPS 443</text><!-- Platform host --><rect x="20" y="124" width="680" height="316" rx="8" style="fill:rgb(246, 247, 249);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="40" y="150" style="fill:rgb(69, 75, 83);stroke:none;stroke-width:1px;font-size:12px;font-weight:600;letter-spacing:0.96px;opacity:1;fill-opacity:1;stroke-opacity:1">平台主機</text><text x="680" y="150" text-anchor="end" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">Docker Compose</text><rect x="60" y="164" width="600" height="80" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="360" y="198" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:17px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">平台伺服器</text><text x="360" y="223" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">網頁介面 · API · 內建 CA</text><rect x="60" y="318" width="160" height="58" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="140" y="352" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:14px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">PostgreSQL</text><rect x="280" y="318" width="160" height="58" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="360" y="352" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:14px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">Prometheus</text><rect x="500" y="318" width="160" height="58" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="580" y="352" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:14px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">Alertmanager</text><text x="372" y="287" style="fill:rgb(69, 75, 83);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">抓取指標</text><text x="415" y="406" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">資料庫與監控的埠</text><text x="415" y="424" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">只在 Docker 網路內</text><!-- Notification channels --><rect x="470" y="500" width="230" height="64" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="585" y="528" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:17px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">通知管道</text><text x="585" y="550" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">Email · Slack · Telegram · Webhook</text><!-- Node host --><rect x="20" y="500" width="400" height="270" rx="8" style="fill:rgb(246, 247, 249);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="40" y="526" style="fill:rgb(69, 75, 83);stroke:none;stroke-width:1px;font-size:12px;font-weight:600;letter-spacing:0.96px;opacity:1;fill-opacity:1;stroke-opacity:1">節點主機</text><text x="400" y="526" text-anchor="end" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">× N</text><rect x="50" y="542" width="340" height="62" rx="8" style="fill:rgb(227, 243, 242);stroke:rgb(40, 127, 124);stroke-width:1.5px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="220" y="569" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:17px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">Agent</text><text x="220" y="591" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">不開對外埠</text><rect x="50" y="684" width="340" height="62" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="220" y="711" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:17px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">Besu</text><text x="220" y="733" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">IBFT 2.0 / QBFT</text><text x="130" y="640" style="fill:rgb(69, 75, 83);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">RPC · metrics</text><text x="130" y="658" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">127.0.0.1</text><text x="310" y="640" style="fill:rgb(69, 75, 83);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">日誌</text><text x="310" y="658" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">:5170</text><!-- The only connection between node and platform: outbound from the agent --><text x="262" y="466" style="fill:rgb(26, 87, 85);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">mTLS 8443</text><text x="262" y="484" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">agent 主動撥出</text><!-- Consortium P2P --><text x="430" y="704" text-anchor="middle" style="fill:rgb(69, 75, 83);stroke:none;stroke-width:1px;font-size:12.5px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">P2P 30303</text><rect x="470" y="684" width="230" height="62" rx="8" style="fill:rgb(255, 255, 255);stroke:rgb(212, 216, 221);stroke-width:1px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></rect><text x="585" y="711" text-anchor="middle" style="fill:rgb(20, 22, 26);stroke:none;stroke-width:1px;font-size:17px;font-weight:600;opacity:1;fill-opacity:1;stroke-opacity:1">其他單位</text><text x="585" y="733" text-anchor="middle" style="fill:rgb(108, 114, 124);stroke:none;stroke-width:1px;font-size:13px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1">各自的節點與平台</text><!-- Connections last, so arrowheads sit on top of the boxes --><line x1="360" y1="80" x2="360" y2="162" marker-end="url(#arch-arrow)" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="140" y1="246" x2="140" y2="316" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="360" y1="318" x2="360" y2="246" marker-end="url(#arch-arrow)" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="440" y1="347" x2="498" y2="347" marker-end="url(#arch-arrow)" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="580" y1="376" x2="580" y2="498" marker-end="url(#arch-arrow)" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="120" y1="604" x2="120" y2="682" marker-end="url(#arch-arrow)" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="300" y1="684" x2="300" y2="606" marker-end="url(#arch-arrow)" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="250" y1="542" x2="250" y2="248" marker-end="url(#arch-arrow-accent)" style="fill:none;stroke:rgb(40, 127, 124);stroke-width:2.5px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line><line x1="390" y1="715" x2="470" y2="715" style="fill:none;stroke:rgb(108, 114, 124);stroke-width:1.25px;stroke-dasharray:5px, 5px;font-size:16px;font-weight:400;opacity:1;fill-opacity:1;stroke-opacity:1"></line></svg>
