        configured: { type: boolean, description: 'A mail server for password emails was configured at deployment (ACCOUNT_SMTP_*)' }

    LocalUserUpdateRequest:
      type: object
      required: [disabled]
      properties:
        disabled: { type: boolean }

    PasswordResetRequest:
      type: object
      properties:
        sendEmail: { type: boolean, description: 'Mail the new password to the account''s email; omitted = do not send' }

    PasswordResetResult:
      type: object
      required: [delivery]
      properties:
        delivery: { $ref: '#/components/schemas/PasswordDelivery' }
        email: { type: string, nullable: true, description: 'This account''s email (where the password was sent, if it was mailed)' }
        generatedPassword: { type: string, nullable: true, description: 'New password when delivery = shown; appears only in this response' }
        mailError: { type: string, nullable: true, description: 'English description of why sending the email failed (the UI displays mailReason), e.g. the mail server is unreachable. The password is still reset and the temporary password is shown on screen for the admin to hand over' }
        mailReason:
          allOf: [{ $ref: '#/components/schemas/ErrorReason' }]
          nullable: true
          description: Code for why sending the email failed (same as Error.reason; the UI translates it into the user's language)
        mailParams:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Variable values in the mailReason message

    NodeStatus:
      type: string
      enum: [healthy, syncing, offline, unknown, rpc_unreachable]
      x-enum-varnames: [NodeStatusHealthy, NodeStatusSyncing, NodeStatusOffline, NodeStatusUnknown, NodeStatusRpcUnreachable] # pin the constant names: oapi-codegen's default naming drifts as same-named enums are added or removed
      description: >
        Maps to the brand.status colors - healthy = green / syncing = amber /
        offline = red (was connected, agent now disconnected) /
        unknown = gray (never connected) /
        rpc_unreachable = amber (agent online but the platform cannot reach the node's RPC, so chain state is unknown; the capability list explains why)

    HourState:
      type: string
      enum: [ok, degraded, down, unknown]
      x-enum-varnames: [HourOk, HourDegraded, HourDown, HourUnknown]
      description: >
        State of a one-hour slot - ok = normal; unknown = no data. For a node's availability24h, degraded = lagging and down = host or Besu metrics were unreadable for 2 consecutive minutes.
        For the chain's stability24h, degraded = block production slowed (reached the ChainSlow multiplier) and down = severely slowed (reached the ChainSlowSevere multiplier)

    ConsensusAlgorithm:
      type: string
      enum: [ibft2, qbft]

    CertStatus:
      type: string
      description: >
        Status of the latest node certificate the platform **issued**, not the one the node holds.
        valid = valid / untrusted = not trusted by the platform (no record under the current CA / revoked / expired).
        There is no "expiring soon" state, since a certificate briefly falls in that window before every normal rotation and that cannot be told apart from a failed rotation.
      enum: [valid, untrusted]

    NodeCertStatus:
      type: object
      description: Node certificate / connection status (top of the node settings page). An untrusted certificate means the one held was not signed by the platform's current CA, which is common after a CA reset
      required: [connection, cert]
      properties:
        connection:
          type: string
          enum: [connected, lost]
          x-enum-varnames: [NodeCertStatusConnectionConnected, NodeCertStatusConnectionLost] # pin the constant names: oapi-codegen's default naming drifts as same-named enums are added or removed
          description: Whether the collector can reach the agent
        lastSeen: { type: string, format: date-time, nullable: true }
        cert: { $ref: '#/components/schemas/CertStatus' }
        notAfter: { type: string, format: date-time, nullable: true }
        serial: { type: string, nullable: true }

    MetricId:
      type: string
      description: Time-series metric (basic tier). blocks_behind = blocks behind, the larger of the highest block the node learned from peers minus its own height (same scrape) and the value the platform computes from this organization's chain head (scrape times differ per node, so values below the tolerance count as 0). txpool_added / txpool_removed / txpool_rejected = transactions per second entering the pool, leaving it (included in a block, replaced or dropped) and rejected. jvm_heap = percentage of Besu's Java heap in use (jvm_memory_used_bytes ÷ jvm_memory_max_bytes, area=heap). txpool_usage = percentage of the transaction pool in use (transactions in the pool ÷ the count limit; only the sequenced pool has a limit, so layered pools have no such series). txpool_oldest = seconds the oldest transaction in the pool has waited (0 for an empty pool; includes transactions stuck behind a nonce gap)
      enum:
        - cpu
        - mem
        - disk
        - net_rx
        - net_tx
        - peer_count
        - chain_height
        - blocks_behind
        - block_time
        - txpool_pending
        - tps
        - txpool_added
        - txpool_removed
        - txpool_rejected
        - jvm_heap
        - txpool_usage
        - txpool_oldest

    # ── Nodes ─────────────────────────────────────────────
    NodeSummary:
      type: object
      description: Row of the "My nodes" list (basic fields). The Enterprise cross-organization endpoint on 8544 (GET /cross-org/nodes) returns the same shape but only with id, org, address, status, besuRunning, chainHeight, peerCount, isValidator, blocksBehind, availability24h, cpuPercent, memPercent, jvmHeapPercent, diskUsedPercent, clientVersion and asOf (the host figures among them require the host scope); name, ports, RPC authentication, certificate and quarantine state are never included.
      required: [id, org, status, asOf]
      properties:
        id: { type: string, example: node-a1 }
        name: { type: string, nullable: true, description: 'Display name given by a user in this organization; null = the UI shows the id. Not included by cross-organization endpoints', example: Taipei primary validator }
        org: { type: string, description: 'Id of the owning organization', example: org-a }
        address: { type: string, nullable: true, description: 'Node address (derived from the net_enode public key; compared with PeerInfo.address to identify the node); null until read', example: '0x91f4480cdcb13537c4c08d4ab060eaa0ecc42bbc' }
        status: { $ref: '#/components/schemas/NodeStatus' }
        besuRunning: { $ref: '#/components/schemas/BesuRunning' }
        chainHeight: { type: integer, format: int64, nullable: true, example: 1284553 }
        peerCount: { type: integer, nullable: true, example: 7 }
        isValidator: { type: boolean, nullable: true, example: true }
        rpcAuthEnabled: { $ref: '#/components/schemas/RpcAuthEnabled' }
        reportedEnode:
          type: string
          nullable: true
          description: The enode reported by the node's net_enode (the address is Besu's --p2p-host, which other nodes may not be able to reach); null until read
          example: 'enode://abc…@10.0.0.31:30303'
        rpcPort:
          type: integer
          nullable: true
          description: The node's local JSON-RPC port. The platform puts it in X-Target (127.0.0.1:<port>) when forwarding through the agent tunnel.
          example: 8545
        metricsPort:
          type: integer
          nullable: true
          description: The node's local metrics port.
          example: 9545
        peerMode: { $ref: '#/components/schemas/PeerMode' }
        capabilities:
          allOf: [{ $ref: '#/components/schemas/NodeCapabilities' }]
          nullable: true
          description: Capability list, same as NodeDetail; the node list uses it to flag what each node is missing. Not included by cross-organization endpoints
        cpuPercent: { type: number, format: float, nullable: true, description: 'Host CPU usage (%); null when the agent reports no host metrics', example: 42.3 }
        diskUsedPercent: { type: number, format: float, nullable: true, description: 'Data disk usage (%); null when the agent reports no host metrics', example: 61.0 }
        memPercent: { type: number, format: float, nullable: true, description: 'Host memory usage (%, memUsedBytes ÷ memTotalBytes); null when the agent reports no host metrics', example: 44.4 }
        jvmHeapPercent: { type: number, format: float, nullable: true, description: 'Percentage of Besu''s own memory allowance (Java heap) in use (jvm_memory_used_bytes ÷ jvm_memory_max_bytes, area=heap); null when Besu metrics cannot be read', example: 5.2 }
        availability24h:
          type: array
          items: { $ref: '#/components/schemas/HourState' }
          description: >
            One slot per hour for the last 24 hours, 24 slots from oldest to newest (the last slot is the hour ending now). down = host or Besu metrics were unreadable for 2 consecutive minutes within that hour
            (matching the NodeOffline / BesuMetricsDown alerts; time when the platform itself was down does not count); degraded = not down, but lagged by ≥ 5 blocks at some point;
            unknown = no data for this node in that hour
        txpoolPending: { type: integer, nullable: true, description: 'Number of pending transactions; null when RPC is unreachable or TXPOOL is not enabled on the node', example: 3 }
        blocksBehind: { type: integer, nullable: true, description: 'Blocks behind - the larger of what Besu reports (highestBlock − currentBlock from eth_syncing, 0 when in sync) and what the platform computes from this organization''s chain head (0 below the tolerance); nodes without peers rely on the latter. null when RPC is unreachable', example: 0 }
        clientVersion: { type: string, nullable: true, description: 'Client version reported by web3_clientVersion; null when RPC is unreachable', example: 'besu/v25.4.1/linux-x86_64/openjdk-java-21' }
        asOf: { $ref: '#/components/schemas/Timestamp' }
        quarantinedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Non-null = this node is still dialing into the platform with a **revoked** certificate and has been quarantined (excluded from SD, no longer scraped). Cleared automatically once the node
            reconnects with a valid certificate or re-enrolls successfully. Expired certificates or ones not issued by this organization never end up here;
            both are rejected during the TLS handshake and only show as offline.
        agentOutdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Non-null = this node's agent protocol version is older than the platform requires and its latest connection was rejected at this time (HTTP 426); the agent needs upgrading.
            Cleared once a compatible version connects. Kept only in platform memory; after a platform restart the agent's next reconnect records it again.
        lastSeen:
          type: string
          format: date-time
          nullable: true
          description: When the platform last collected from this node's agent (the same value as lastSeen in GET /nodes/{id}/cert); null when it has nothing collected

    NodeDetail:
      type: object
      description: Details of a node in this organization. The Enterprise cross-organization endpoint on 8544 (GET /cross-org/nodes/{id}) returns the same shape but only with id, org, status, besuRunning, validatorAddress, clientVersion, hardware, p2p (only peerCount, peerLimit, inSync), ledger, consensus and asOf; ports, RPC authentication, enode, quarantine state and the capability list are never included. Charts (GET /cross-org/nodes/{id}/series) return MetricSeries with the same parameters as getNodeSeries.
      required: [id, org, status, asOf]
      properties:
        id: { type: string }
        name: { type: string, nullable: true, description: 'Display name given by a user in this organization; null = the UI shows the id. Not included by cross-organization endpoints' }
        org: { type: string }
        status: { $ref: '#/components/schemas/NodeStatus' }
        besuRunning: { $ref: '#/components/schemas/BesuRunning' }
        rpcAuthEnabled: { $ref: '#/components/schemas/RpcAuthEnabled' }
        rpcPort:
          type: integer
          nullable: true
          description: The node's local JSON-RPC port. The platform puts it in X-Target (127.0.0.1:<port>) when forwarding through the agent tunnel.
          example: 8545
        metricsPort:
          type: integer
          nullable: true
          description: The node's local metrics port.
          example: 9545
        reportedEnode:
          type: string
          nullable: true
          description: The enode reported by the node's net_enode (the address is Besu's --p2p-host, which other nodes may not be able to reach); null until read
        clientVersion: { type: string, nullable: true, description: 'Client version reported by web3_clientVersion; null when RPC is unreachable', example: 'besu/v25.4.1/linux-x86_64/openjdk-java-21' }
        validatorAddress:
          type: string
          nullable: true
          description: Validator address derived from the node key (the platform derives it from the net_enode enode)
          example: '0xA11c3f2…'
        quarantinedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Non-null = this node is still dialing into the platform with a **revoked** certificate and has been quarantined (excluded from SD, no longer scraped). Cleared automatically once the node
            reconnects with a valid certificate or re-enrolls successfully. Expired certificates or ones not issued by this organization never end up here;
            both are rejected during the TLS handshake and only show as offline.
        agentOutdatedAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Non-null = this node's agent protocol version is older than the platform requires and its latest connection was rejected at this time (HTTP 426); the agent needs upgrading.
            Cleared once a compatible version connects. Kept only in platform memory; after a platform restart the agent's next reconnect records it again.
        hardware:
          allOf: [{ $ref: '#/components/schemas/HardwareMetrics' }]
          nullable: true
        p2p:
          allOf: [{ $ref: '#/components/schemas/P2PStatus' }]
          nullable: true
        ledger:
          allOf: [{ $ref: '#/components/schemas/LedgerSummary' }]
          nullable: true
        consensus:
          allOf: [{ $ref: '#/components/schemas/ConsensusStatus' }]
          nullable: true
        capabilities:
          allOf: [{ $ref: '#/components/schemas/NodeCapabilities' }]
          nullable: true
          description: Capability list
        asOf: { $ref: '#/components/schemas/Timestamp' }

    # ── Per-layer metrics (basic tier) ──────────────
    HardwareMetrics:
      type: object
      description: Basic hardware metrics
      properties:
        active: { type: boolean }
        cpuPercent: { type: number, format: float, example: 42.3 }
        memUsedBytes: { type: integer, format: int64 }
        memTotalBytes: { type: integer, format: int64 }
        diskUsedPercent: { type: number, format: float, example: 61.0 }
        diskDaysLeft:
          type: number
          format: float
          nullable: true
          description: Days until the disk is full, projected from disk usage growth over the last 7 days; null when usage is not growing, there is less than 7 days of data, or it exceeds 365 days (see diskDaysLeftReason for which)
        diskDaysLeftReason:
          type: string
          enum: [insufficient_data, not_growing, over_a_year]
          x-enum-varnames: [DiskDaysLeftInsufficientData, DiskDaysLeftNotGrowing, DiskDaysLeftOverAYear] # pin the constant names: oapi-codegen's default naming drifts as same-named enums are added or removed
          description: Why diskDaysLeft is null - less than 7 days of data, not growing, or more than 365 days. Omitted when there is a day count, or when the platform has no disk data yet (unknown)
        netRxBytesPerSec: { type: integer, format: int64 }
        netTxBytesPerSec: { type: integer, format: int64 }

    P2PStatus:
      type: object
      description: Basic P2P metrics
      properties:
        enode: { type: string, example: 'enode://abc...@10.0.0.1:30303' }
        peerCount: { type: integer, example: 7 }
        peerLimit: { type: integer, example: 25 }
        inSync: { type: boolean }

    LedgerSummary:
      type: object
      description: Basic ledger metrics
      properties:
        chainHeight: { type: integer, format: int64, example: 1284553 }
        blocksBehind: { type: integer, example: 0, description: 'Blocks behind, same as NodeSummary.blocksBehind (the larger of the self-reported value and the one the platform computes from the chain head)' }
        txpoolPending: { type: integer, example: 12 }
        tps: { type: number, format: float, example: 3.4 }

    ConsensusStatus:
      type: object
      description: Basic consensus metrics (part of the basic set)
      properties:
        algorithm: { $ref: '#/components/schemas/ConsensusAlgorithm' }
        validatorCount: { type: integer, example: 4 }
        isValidator: { type: boolean }
        validators:
          type: array
          description: Current set of validator addresses
          items: { type: string, example: '0xabc...' }
        proposerMetrics:
          type: array
          description: Distribution of block proposals per validator over the last 1000 blocks (read by the platform via ibft/qbft_getSignerMetrics; the first round after a node joins uses Besu's default of 100 blocks; omitted when unavailable)
          items: { $ref: '#/components/schemas/ProposerMetric' }

    ProposerMetric:
      type: object
      description: Advanced consensus - block proposals of a single validator within the recent block window
      required: [address, proposedBlockCount, lastProposedBlockNumber]
      properties:
        address: { type: string, example: '0xabc...' }
        proposedBlockCount: { type: integer, example: 25 }
        lastProposedBlockNumber: { type: integer, example: 10231 }

    # ── Time series ─────────────────────────────────────────
    MetricSeries:
      type: object
      required: [metric, points]
      properties:
        metric: { $ref: '#/components/schemas/MetricId' }
        unit: { type: string, nullable: true, example: '%' }
        points:
          type: array
          items: { $ref: '#/components/schemas/MetricPoint' }

    MetricPoint:
      type: object
      required: [t, v]
      properties:
        t: { $ref: '#/components/schemas/Timestamp' }
        v: { type: number, format: double, nullable: true }

    FleetNodeStatus:
      type: object
      description: >
        A node whose agent the platform has not been able to reach for at least 10 minutes. Nodes that are fine are not listed,
        so there is no ok value; a shorter gap is not flagged (it shows as a gap in the chart).
      required: [nodeId, status, since]
      properties:
        nodeId: { type: string, example: node-c1 }
        status:
          type: string
          enum: [unreachable]
        since:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: When the agent stopped answering; the displayed duration is always at least the 10-minute threshold
        reason: { type: string, nullable: true, description: 'Human-readable detail (e.g. "node agent not responding")' }

    # ── Authorization ─────────────────────────────────────────────
    ValidatorSetEntry:
      type: object
      description: A member of the current validator set (read-only, aggregated from the consensus state each node reports)
      required: [address, connectedNodes, turns]
      properties:
        address: { type: string, example: '0xabc...' }
        orgId: { type: string, nullable: true, example: org-a, description: 'null when the identity cannot be found; left blank rather than made up' }
        nodeId: { type: string, nullable: true, description: 'Node id known to the platform; null if not provisioned by this platform' }
        name:
          type: string
          nullable: true
          description: Name a user gave this validator (PUT /peer-names/{address}); null if unnamed. Displays fall back to nodeId when there is no name
        turns:
          type: array
          description: >
            Outcome of every turn this validator had to propose within the last 1000 blocks (the same range as signer metrics), oldest to newest. Derived from block headers -
            if a block's round is r, then ordering that block's validator set by address, the r validators just before the actual proposer had their turn but did not produce a block. There are fewer entries when the chain has fewer than 1000 blocks
            or the platform has just started and has not backfilled blocks yet.
          items: { $ref: '#/components/schemas/ValidatorTurn' }
        connectedNodes:
          type: integer
          nullable: true
          description: How many of this organization's nodes that reported a peer list currently have a P2P connection to it (matched by deriving addresses from admin_peers public keys). null = no node in this organization reported a peer list this round (ADMIN not enabled, nodes offline, or the platform just restarted), so it is unknown. Informational only; the platform does not alert on it
          example: 2
        producing:
          type: boolean
          nullable: true
          description: >
            Whether it is producing blocks. Based on turns for both this organization and others - false if it missed its last 2 turns, true otherwise.
            This organization's validators also consider node status - false outright when the agent is up but RPC is unreachable (except 401); a disconnected agent counts as false only when the chain has halted
            (while the chain is still producing, the platform just cannot see the node, so turns decide); nodes that never connected do not count.
            null = unknown (turns is empty because it just joined and has not had a turn, there is no healthy source node, or the platform just started and has not backfilled blocks).
            When the chain has halted (the latest block is older than the "severely slowed or stopped" multiplier) there are no new blocks, so other organizations' validators are judged by P2P - false if disconnected from all of this organization's nodes,
            otherwise the value from before the halt is kept; no judgment is made when none of this organization's nodes returns a peer list or all lists are empty. While halted the UI never shows true (it always shows "Consensus stalled")

    ValidatorTurn:
      type: object
      required: [block, proposed]
      properties:
        block: { type: integer, format: int64, description: 'Number of the block at which it had its turn' }
        proposed: { type: boolean, description: 'true = it produced this block; false = it had the turn but the next validator took over' }
        at: { type: string, format: date-time, nullable: true, description: 'Timestamp of the block it produced; null when proposed is false' }
        txCount: { type: integer, nullable: true, description: 'Number of transactions in the block it produced; null when proposed is false' }
        gasUsed: { type: integer, format: int64, nullable: true, description: 'gasUsed of the block it produced; null when proposed is false' }
        gasLimit: { type: integer, format: int64, nullable: true, description: 'gasLimit of the block it produced (varies per block); null when proposed is false' }

    ChainInfo:
      type: object
      description: >
        Chain-level info. The source is this organization's healthy node with the highest block height (sourceNodeId); with no healthy node, sourceNodeId is null,
        the other fields are null too and blockIntervals is empty. Block intervals for the last 36 blocks are kept in platform memory and not stored in Prometheus.
        height and latestBlockAt update every 2 seconds; the rest follow the 10-second collection round.
      required: [blockIntervals, stability24h, asOf]
      properties:
        sourceNodeId: { type: string, nullable: true, example: node-a1 }
        chainId: { type: integer, format: int64, nullable: true, description: eth_chainId, example: 1337 }
        consensus:
          allOf: [{ $ref: '#/components/schemas/ConsensusAlgorithm' }]
          nullable: true
        height: { type: integer, format: int64, nullable: true, example: 1284553 }
        latestBlockAt: { type: string, format: date-time, nullable: true, description: 'Timestamp of the latest block' }
        blockIntervals:
          type: array
          description: Block intervals (seconds) of up to the last 36 blocks, oldest to newest; fewer right after the platform starts or when the chain has fewer than 37 blocks
          items: { type: number, format: float }
          example: [2, 2, 2, 4, 2]
        validatorCount: { type: integer, nullable: true, example: 4 }
        blockQuorum:
          type: integer
          nullable: true
          description: Block production quorum ⌈2N/3⌉ (N = validatorCount), same as Besu's BftHelpers.calculateRequiredValidatorQuorum; block production stops when fewer validators than this are online
          example: 3
        epochLength:
          type: integer
          format: int64
          nullable: true
          description: IBFT2 / QBFT epoch length (from admin_nodeInfo of any node in this organization with ADMIN enabled; Besu's default of 30000 when genesis does not set it). At each epoch boundary the on-chain tally resets and nodes automatically recast votes that have not taken effect. null when the consensus type is unknown or no node in this organization has ADMIN enabled (the platform does not guess the default; epochStart and votesFrom are then null too and ValidatorVotes.tallyKnown is false)
          example: 30000
        epochStart:
          type: integer
          format: int64
          nullable: true
          description: First block of the current epoch (height − height % epochLength)
          example: 1260000
        votesFrom:
          type: integer
          format: int64
          nullable: true
          description: >
            The block from which the tally is complete. Equal to epochStart = every vote in this epoch has been seen; greater than epochStart = the platform is still backfilling in the background after a restart,
            or the source node has no earlier block headers (a node that joined via checkpoint sync), and votes written before it are not in voters
          example: 1260000
        blockPeriodSeconds:
          type: number
          format: float
          nullable: true
          description: >
            Seconds per block when there are transactions - genesis blockperiodseconds (from admin_nodeInfo of any node in this organization with ADMIN enabled); when unavailable, the median interval of blocks with transactions
            among the last 36 blocks. null when there is no source node
          example: 2
        emptyBlockPeriodSeconds:
          type: number
          format: float
          nullable: true
          description: >
            Seconds per block when there are no transactions (the QBFT / IBFT2 empty block period; Besu does not report this setting, so it is the median interval of blocks with 0 transactions among the last 36 blocks).
            Equals blockPeriodSeconds on chains without an empty block period, and also when there are no empty blocks to go by
          example: 2
        expectedBlockPeriodSeconds:
          type: number
          format: float
          nullable: true
          description: >
            Expected seconds per block right now - blockPeriodSeconds when transactions are waiting in the pool and the latest block has transactions, otherwise emptyBlockPeriodSeconds (same as Besu's block production logic).
            This is the baseline for "block production slowed", and the ChainSlow / ChainSlowSevere alerts use the same number
          example: 2
        genesisAt: { type: string, format: date-time, nullable: true, description: 'Timestamp of the genesis block (block 0); null when unavailable' }
        evmVersion:
          type: string
          nullable: true
          description: >
            Latest hard fork active at the chain head (EVM version, e.g. London, Shanghai, Cancun, Prague), derived from the chain config in admin_nodeInfo;
            Frontier when no forks are configured. null when no node in this organization has ADMIN enabled
          example: Shanghai
        roundChanges1h:
          allOf: [{ $ref: '#/components/schemas/RoundChanges' }]
          nullable: true
          description: Round timeouts in the last hour (the validator whose turn it was did not produce and the next one took over); null when there is no source node
        stability24h:
          type: array
          description: Block production per hour over the last 24 hours (24 slots, oldest to newest); the multipliers come from the current values of the ChainSlow / ChainSlowSevere alert rules
          items: { $ref: '#/components/schemas/HourState' }
        asOf: { $ref: '#/components/schemas/Timestamp' }
        dataAgeSec:
          type: number
          nullable: true
          description: Age in seconds, at response time, of the source node's data (computed server-side, unaffected by the browser clock); null when there is no source

    ChainNode:
      type: object
      description: >
        A node on the chain, one entry per address. Ordered by validators first, then this organization's nodes, then by the number of this organization's nodes connected to it (descending), then by address.
        This organization's nodes are identified by what net_enode reports; validators of this organization that have not reported yet are listed as belonging to someone else
      required: [address, isValidator, isOwn]
      properties:
        address: { type: string, description: '0x + lowercase' }
        name: { type: string, nullable: true, description: 'Name given by this organization (peer-names; nodes.name for this organization''s nodes)' }
        isValidator: { type: boolean, description: 'In the current validator set' }
        isOwn: { type: boolean }
        nodeId: { type: string, nullable: true, description: 'Platform id of this organization''s node' }
        producing: { type: boolean, nullable: true, description: 'Validators only; same as ValidatorSetEntry.producing' }
        missedTurns1000:
          type: integer
          nullable: true
          description: Validators only - how many times in the last 1000 blocks it had the turn to propose but timed out and the next validator took over (the number of proposed=false entries in ValidatorSetEntry.turns); null when it has no turn history yet (same as producing)
        lastProposed:
          allOf: [{ $ref: '#/components/schemas/ProposedBlock' }]
          nullable: true
          description: Validators only - the last block it proposed among the blocks the platform caches (the last 3600 blocks); null if none
        blocksBehind:
          type: integer
          format: int64
          nullable: true
          description: >
            Blocks behind the chain head. For this organization's nodes, same as NodeSummary.blocksBehind; for other nodes, estimated from the admin_peers latestBlock seen in the same round
            by the highest of this organization's nodes connected to it (±1 block, updated only when the peer broadcasts a new block). null when no node of this organization is connected to it, or none of those has ADMIN enabled

    ProposedBlock:
      type: object
      required: [height, at]
      properties:
        height: { type: integer, format: int64 }
        at: { type: string, format: date-time }

    RoundChanges:
      type: object
      required: [total, byProposer]
      properties:
        total: { type: integer, description: 'Total round timeouts in the last hour' }
        byProposer:
          type: array
          description: Grouped by the validator that should have proposed, most first
          items: { $ref: '#/components/schemas/RoundChangeCount' }

    RoundChangeCount:
      type: object
      required: [address, count]
      properties:
        address: { type: string }
        name: { type: string, nullable: true, description: 'Name given by this organization (peer-names)' }
        orgId: { type: string, nullable: true, description: 'Only for this organization''s validators' }
        nodeId: { type: string, nullable: true, description: 'Only for this organization''s validators' }
        count: { type: integer }

    ValidatorVoteRequest:
      type: object
      required: [address, add]
      properties:
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        add: { type: boolean, description: 'true = vote to add; false = vote to remove' }

    ValidatorVoteResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/ValidatorVoteNodeResult' }

    ValidatorVoteNodeResult:
      type: object
      required: [nodeId, ok]
      properties:
        nodeId: { type: string }
        ok: { type: boolean }
        error: { type: string, nullable: true, description: 'English description of the failure (for developers and logs); the UI displays reason' }
        reason:
          allOf: [{ $ref: '#/components/schemas/ErrorReason' }]
          nullable: true
          description: Failure reason code (same as Error.reason; the UI translates it into the user's language)
        params:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Variable values in the reason message

    ValidatorVoteRecord:
      type: object
      description: >
        A finished validator vote (to add or remove address). There are only two outcomes - passed = reached a majority and the validator set changed (endedBlock is the block where the set changed);
        expired = no majority by the epoch boundary (endedBlock is the boundary block), or every vote cast was cancelled by an opposite vote, or the voters were removed from the validator set (the count dropped to zero, votes 0).
        A later vote for the same address and direction starts a new record
      required: [address, add, result, firstVoteAt, endedAt, endedBlock, votes, needed, ballots]
      properties:
        address: { type: string, description: '0x + lowercase' }
        add: { type: boolean }
        result: { $ref: '#/components/schemas/ValidatorVoteOutcome' }
        firstVoteAt: { type: string, format: date-time, description: 'Time the first vote was written into a block' }
        endedAt: { type: string, format: date-time }
        endedBlock: { type: integer, format: int64 }
        votes: { type: integer, description: 'Number of votes counted when it ended' }
        needed: { type: integer, description: 'Majority threshold at the time (validator count / 2 + 1)' }
        ballots:
          type: array
          description: Every validator eligible to vote when it ended (sorted by address) and its vote; the earliest voter is the proposer
          items: { $ref: '#/components/schemas/ValidatorBallot' }

    ValidatorVoteOutcome:
      type: string
      enum: [passed, expired]
      x-enum-varnames: [ValidatorVotePassed, ValidatorVoteExpired]

    ValidatorBallot:
      type: object
      required: [address, votedAt, block]
      properties:
        address: { type: string }
        votedAt: { type: string, format: date-time, nullable: true, description: 'Time the vote was written into a block; null if it did not vote' }
        block: { type: integer, format: int64, nullable: true, description: 'Block the vote was written into; null if it did not vote' }
        own: { type: boolean, description: 'A validator of this organization' }
        name: { type: string, nullable: true }
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
          description: This organization withdrew the vote; this is when the cancelling vote was written into a block. votedAt / block still refer to the original vote, which is not counted in votes

    ValidatorVotes:
      type: object
      required: [validatorCount, needed, ownValidators, votes, tallyKnown]
      properties:
        tallyKnown:
          type: boolean
          description: >
            Whether the counts can be trusted. false = the epoch length is unknown (no node in this organization has ADMIN enabled; see ChainInfo.epochLength), so voters come only from the recent blocks the platform keeps,
            the epoch boundary is unknown, and counted votes may already be void. Proposals are still listed and can be joined, but do not use countedAt to compute counts or progress
        validatorCount: { type: integer, description: 'Current number of validators on chain' }
        needed: { type: integer, description: 'Votes needed to take effect (floor(validatorCount/2) + 1)' }
        ownValidators:
          type: array
          description: This organization's validator nodes (those whose validator address is in the current set); votes are sent to these nodes
          items: { type: string }
        votes:
          type: array
          items: { $ref: '#/components/schemas/ValidatorVote' }

    ValidatorVote:
      type: object
      description: A change under vote (target address + direction) not yet reflected in the validator set. Counted votes = the number of voters whose countedAt is not null; it takes effect on reaching needed
      required: [address, add, voters]
      properties:
        address: { type: string }
        add: { type: boolean }
        voters:
          type: array
          description: >
            Validators that cast this vote - those written into blocks this epoch (network-wide, counting only validators still in the set),
            plus votes our own nodes have sent that are not yet in a block this epoch. Sorted by address
          items: { $ref: '#/components/schemas/ValidatorVoter' }

    ValidatorVoter:
      type: object
      required: [address]
      properties:
        address: { type: string, description: 'Validator address (0x + lowercase)' }
        nodeId: { type: string, nullable: true, description: 'Only for this organization''s nodes' }
        pending:
          type: boolean
          description: >
            true = the vote is still in the pending list of this organization's node; false = another organization, or the node reported a pending list without this vote;
            omitted = no snapshot from this organization's node (agent offline, etc.), so it is unknown.
        countedAt:
          type: integer
          format: int64
          nullable: true
          description: Block number this vote was written into in the current epoch; null = sent by our own node but it has not had its turn to produce a block yet
        countedAtTime:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the countedAt block; null until written into a block
        withdrawing:
          type: boolean
          description: >
            This organization's vote is being withdrawn - the vote is already in a block and the platform has sent an opposite vote from this node to cancel it; the count drops only once that is written into a block (this node's next block),
            and the vote still counts until then. Omitted when not being withdrawn
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
          description: >
            This organization's vote has been withdrawn; this is when the cancelling vote was written into a block, and this node's vote no longer counts (countedAt is null, pending is false).
            The voter is listed only while the same vote still has other counted votes; omitted when not withdrawn or not this organization's

    AlertStatus:
      type: string
      enum: [firing, resolved]
      x-enum-varnames: [AlertStatusFiring, AlertStatusResolved] # pin the constant names, as above

    AlertList:
      type: object
      description: >
        Alert list. When the monitoring source (Prometheus or Alertmanager) is down, the alerts in the database are still returned with monitoringAvailable false;
        no new firing or resolution arrives during that time, so alerts stop updating.
      required: [alerts, monitoringAvailable]
      properties:
        alerts:
          type: array
          items: { $ref: '#/components/schemas/Alert' }
        monitoringAvailable:
          type: boolean
          description: Prometheus is reachable, and so is Alertmanager when configured. false = alerts are not updated in real time

    Alert:
      type: object
      description: >
        An alert fired by a Prometheus/Alertmanager rule. nodeId is present only on node-level alerts;
        it is null for platform event alerts (certificate expiry, failed votes).
      required: [id, fingerprint, alertname, severity, status, labels, annotations, startsAt, readFire, readResolve]
      properties:
        id: { type: string, description: 'Identifier assigned by the platform (the same from firing to resolution of one alert); send it when marking as read. Its format is not guaranteed' }
        fingerprint: { type: string, description: 'Stable deduplication key from Alertmanager' }
        alertname: { type: string, example: NodeOffline }
        nodeId: { type: string, nullable: true }
        severity: { type: string, enum: [critical, warning] }
        status: { $ref: '#/components/schemas/AlertStatus' }
        labels: { type: object, additionalProperties: { type: string } }
        annotations:
          type: object
          additionalProperties: { type: string }
          description: summary, description, rule_name; threshold rules also have value (the value when it fired, the raw Prometheus {{ $value }}, e.g. "86.2")
        startsAt: { $ref: '#/components/schemas/Timestamp' }
        endsAt:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          nullable: true
        readFire: { type: boolean, description: 'The current user has read the firing entry' }
        readResolve: { type: boolean, description: 'The current user has read the resolved entry (false while still firing; becomes unread again on resolution)' }

    AlertReadRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string }
          description: Alert.id

    # ── Node enrollment (join token) ──────
    JoinTokenStatus:
      type: string
      enum: [pending, used, expired, revoked]
      # x-enum-varnames pins the Go constant names. Without it, adding or removing a value like "pending" in another schema changes oapi-codegen's
      # name-collision detection, making these constants drift between JoinTokenStatusPending and Pending and breaking callers.
      x-enum-varnames: [JoinTokenStatusPending, JoinTokenStatusUsed, JoinTokenStatusExpired, JoinTokenStatusRevoked]
      description: pending = not yet used; used = the agent has joined (single use); expired = not used in time; revoked = revoked after issuance

    JoinTokenTtl:
      type: string
      enum: ['15m', '1h', '24h']
      description: Token validity period (default 1h)

    JoinTokenCreateRequest:
      type: object
      required: [nodeId]
      properties:
        nodeId:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9-]{0,62}$'
          description: >
            Node id the node gets after joining with this token (bound at creation). agent join sends only the token; the platform takes the node id from the token
            and writes it into the certificate CN. A new node requires that the id does not exist yet; re-enroll requires that it is already registered. Uppercase is converted to lowercase before storing.
          example: node-a3
        rpcPort:
          type: integer
          minimum: 1
          maximum: 65535
          default: 8545
          description: The node's local JSON-RPC port (Besu rpc-http-port). The platform forwards to 127.0.0.1:<this port> through the agent tunnel. Written only when a new node joins; re-enroll does not change it (use PUT /nodes/{id}/ports to change ports)
        metricsPort:
          type: integer
          minimum: 1
          maximum: 65535
          default: 9545
          description: The node's local metrics port (Besu metrics-port). Prometheus scrapes 127.0.0.1:<this port>/metrics through the agent tunnel. Written only when a new node joins; re-enroll does not change it
        nodeName:
          type: string
          nullable: true
          maxLength: 64
          description: Display name of the node after joining (optional); written when a new node joins, unchanged by re-enroll
          example: Taipei primary validator
        allowedSources:
          type: array
          items: { type: string }
          description: Source IP allowlist (optional). IPs or CIDRs; if set, agent join / re-enroll is rejected when the source IP is not in the list. Empty means no restriction
          example: ['10.0.0.31']
        ttl:
          allOf: [{ $ref: '#/components/schemas/JoinTokenTtl' }]
          default: '1h'
    JoinToken:
      type: object
      description: Join token list item. Contains no secret; the full token appears only once, in the creation response (JoinTokenCreated).
      required: [id, nodeId, status, createdAt, expiresAt, allowedSources]
      properties:
        id: { type: string, example: jt-01 }
        nodeName: { type: string, nullable: true, description: 'Display name of the node after joining', example: Taipei primary validator }
        allowedSources:
          type: array
          items: { type: string }
          description: Source IP allowlist (normalized to CIDR); empty array = no restriction
          example: ['10.0.0.31/32']
        status: { $ref: '#/components/schemas/JoinTokenStatus' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        nodeId:
          type: string
          description: Node id bound to this token (set at creation)
          example: node-a1

    JoinTokenCreated:
      allOf:
        - $ref: '#/components/schemas/JoinToken'
        - type: object
          required: [token, platformAddr]
          properties:
            token:
              type: string
              description: The full join token (includes the root CA digest to prevent MITM). Returned only once, in this response; the platform does not keep the plaintext.
              example: 'BSOS-1-sha256:9f2a…c41e-7kx3m…q8wz'
            platformAddr:
              type: string
              description: Platform agent mTLS address (host:port); the frontend uses it for --platform in the install.sh command
              example: 'platform.org-a:8443'

    PeerInfo:
      type: object
      description: An entry from a node's admin_peers. Only two things are proven - the peer holds this public key (the handshake succeeded), and whether the address derived from it is an on-chain validator. The name is given by a user in this organization.
      required: [address, inbound]
      properties:
        pubkey: { type: string, nullable: true, description: 'Node public key (128 lowercase hex characters); omitted without monitor:view (cross-organization forwarding)' }
        address: { type: string, description: 'Address derived from the public key (0x + lowercase); names are keyed by it' }
        enode: { type: string, nullable: true, description: 'Enode reported by admin_peers - host is the remote IP of the connection and the port is the listening port the peer announces (the ephemeral port is in remoteAddress); omitted without monitor:view (cross-organization forwarding)' }
        remoteAddress: { type: string, nullable: true, description: 'Actual remote address of the connection (ip:port); omitted without monitor:view (cross-organization forwarding)' }
        inbound: { type: boolean, description: 'true = the peer initiated the connection' }
        nodeId: { type: string, nullable: true, description: 'Node id when it is a node of this organization (set = this organization)' }
        validatorAddress: { type: string, nullable: true, description: 'Its address when it is an on-chain validator (set = validator; also present for this organization''s nodes)' }
        name: { type: string, nullable: true, description: 'Name given by a user in this organization' }

    ManualPeer:
      type: object
      required: [pubkey, address, enode, createdAt]
      properties:
        pubkey: { type: string, description: 'Public key of the enode (lowercase); the list is keyed by it' }
        address: { type: string, description: 'Address derived from the public key (0x + lowercase); peer names are keyed by it (PUT /peer-names/{address})' }
        enode: { type: string, description: 'Enode pushed to nodes (enode://<pubkey>@<IP>:<port>)' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    ManualPeerCreateRequest:
      type: object
      required: [enode]
      properties:
        enode: { type: string, description: 'enode://<128-hex pubkey>@<IP>:<port>; the host must be an IP (Besu does not accept host names)' }

    PeerMode:
      type: string
      enum: ['off', shared, custom]
      x-enum-varnames: [PeerModeOff, PeerModeShared, PeerModeCustom]
      description: >
        Summary of a node's extra peers, derived from the switch and the directly added peers - shared = uses the shared list; custom = does not use it but has directly added peers;
        off = neither (the platform adds no peers to this node). The platform never touches static-nodes.json or bootnodes

    PeerSharedRequest:
      type: object
      required: [useShared]
      properties:
        useShared: { type: boolean }

    NodeCustomPeers:
      type: object
      description: 'What this node gets pushed = (useShared ? the shared list minus itself and quarantined nodes : empty) ∪ directly added peers (for the same public key, the shared list entry wins)'
      required: [useShared, peers]
      properties:
        useShared: { type: boolean, description: 'Whether this node uses the shared list; off by default' }
        peers:
          type: array
          description: Peers added directly to this node (regardless of the switch)
          items: { $ref: '#/components/schemas/CustomPeer' }

    CustomPeer:
      type: object
      required: [pubkey, enode, quarantined]
      properties:
        pubkey: { type: string }
        enode: { type: string, description: 'Enode pushed to this node (the value stored in the list)' }
        name: { type: string, nullable: true, description: 'Display name - the node name for this organization''s nodes, otherwise from peer_names' }
        nodeId: { type: string, nullable: true, description: 'Which node of this organization the public key belongs to' }
        quarantined: { type: boolean, description: 'The public key belongs to a quarantined node of this organization; not pushed this round' }

    NodeTxPool:
      type: object
      description: |
        Snapshot of a node's transaction pool. When syncing is true, Besu has disabled the pool (RPC returns only empty results) and all other fields are empty.
        The counts and oldest time in totals cover the whole pool; pending / queued cover only accounts in senders whose nextNonce was fetched (not the whole pool when truncated).
      required: [asOf, syncing, localCount, remoteCount, totals, truncated, senders]
      properties:
        asOf: { type: string, format: date-time }
        syncing: { type: boolean, description: 'The node is syncing; Besu disables the transaction pool meanwhile' }
        maxSize:
          type: integer
          nullable: true
          description: Transaction count limit of the pool (tx-pool-max-size of a sequenced pool); null for layered pools, which are limited by size rather than count
        localCount: { type: integer, description: 'Transactions sent directly to this node''s RPC' }
        remoteCount: { type: integer, description: 'Transactions forwarded from other nodes' }
        totals: { $ref: '#/components/schemas/TxPoolTotals' }
        truncated: { type: boolean, description: 'More than 200 accounts (senders lists only the 200 with the most transactions), or more than 500 transactions in the pool (nonces cannot be fetched for the excess, so their accounts may look like they have nonce gaps). truncated true with empty senders means the pool is too large and the list exceeds the agent channel''s response limit, so only counts are returned (totals and oldestAddedAt are unknown); querying a single address with from still works' }
        senders:
          type: array
          items: { $ref: '#/components/schemas/TxPoolSender' }
        rejected:
          type: array
          nullable: true
          description: Rejections in the last hour by reason (Besu TransactionInvalidReason), most first; null when the platform has no Prometheus, the query to it failed, or the node is syncing
          items: { $ref: '#/components/schemas/TxPoolRejected' }

    TxPoolTotals:
      type: object
      required: [pending, queued]
      properties:
        pending: { type: integer, description: 'Transactions contiguous from the account''s on-chain nonce that can be included directly' }
        queued: { type: integer, description: 'Transactions stuck behind a nonce gap' }
        oldestAddedAt: { type: string, format: date-time, nullable: true, description: 'Time the oldest transaction entered the pool (node local clock); null when the pool is empty' }

    TxPoolSender:
      type: object
      required: [address, nextNonce, txs]
      properties:
        address: { type: string, description: 'Sender address (lowercase)' }
        nextNonce: { type: integer, format: int64, description: 'Next nonce expected on chain (eth_getTransactionCount latest)' }
        txs:
          type: array
          description: Ascending by nonce
          items: { $ref: '#/components/schemas/TxPoolTx' }

    TxPoolTx:
      type: object
      required: [hash, nonce, addedAt, local]
      properties:
        hash: { type: string }
        nonce: { type: integer, format: int64 }
        to: { type: string, nullable: true, description: 'Recipient address; null for contract deployment' }
        addedAt: { type: string, format: date-time, description: 'Time it entered this node''s pool (node local clock)' }
        local: { type: boolean, description: 'true = sent directly to this node''s RPC; false = forwarded from another node' }

    TxPoolRejected:
      type: object
      required: [reason, count]
      properties:
        reason: { type: string, description: 'Besu''s TransactionInvalidReason, e.g. NONCE_TOO_LOW, GAS_PRICE_TOO_LOW, TX_SENDER_NOT_AUTHORIZED' }
        count: { type: integer }

    NodePeers:
      type: object
      required: [reported, peers]
      properties:
        reported: { type: boolean, description: 'false = this node''s admin_peers could not be read this round (ADMIN not enabled or node offline), so empty peers does not mean no connections' }
        peers:
          type: array
          items: { $ref: '#/components/schemas/PeerInfo' }

    SharedPeers:
      type: object
      required: [peers, candidates, nodes]
      properties:
        peers:
          type: array
          description: Every entry of the shared list
          items: { $ref: '#/components/schemas/SharedPeer' }
        nodes:
          type: array
          description: Usage for each node of this organization (sorted by id)
          items: { $ref: '#/components/schemas/SharedPeerNode' }
        candidates:
          type: array
          description: Peers connected to this organization's nodes that are neither in the shared list nor nodes of this organization; they can be added to the shared list. Sorted by how many of this organization's nodes see them, most first
          items: { $ref: '#/components/schemas/PeerCandidate' }

    SharedPeerNode:
      type: object
      required: [id, useShared, additions, quarantined]
      properties:
        id: { type: string }
        useShared: { type: boolean, description: 'Whether this node uses the shared list' }
        additions: { type: integer, description: 'Number of peers added directly to this node' }
        quarantined: { type: boolean }
        missing:
          type: integer
          nullable: true
          description: How many of the peers to push to this node (shared list + directly added) it is currently not connected to; null when quarantined or it did not report admin_peers this round

    SharedPeer:
      type: object
      description: An entry of the shared list
      required: [pubkey, enode, address]
      properties:
        pubkey: { type: string }
        enode: { type: string, description: 'Enode that is pushed' }
        address: { type: string, description: 'Address derived from the public key (0x + lowercase); names are keyed by it' }
        nodeId: { type: string, nullable: true, description: 'Which node of this organization the public key belongs to' }
        name: { type: string, nullable: true, description: 'Display name - the node name for this organization''s nodes, otherwise from peer_names' }

    PeerCandidate:
      type: object
      required: [pubkey, address, enode]
      properties:
        pubkey: { type: string }
        address: { type: string, description: 'Address derived from the public key (0x + lowercase)' }
        enode: { type: string, description: 'Enode reported by admin_peers (taken from one of them when several nodes see it)' }
        validatorAddress: { type: string, nullable: true, description: 'Its address when it is an on-chain validator (set = validator)' }
        name: { type: string, nullable: true, description: 'Name from peer_names' }

    PeerNameRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }

    RpcUser:
      type: object
      description: An RPC access identity is a named set of method permissions, one per organization. The platform stores no password; tokens are issued via /token and JWTs are stateless.
      required: [id, username, permissions, createdAt]
      properties:
        id: { type: string, description: 'User id; a user recreated under the same name gets a new id' }
        username: { type: string, description: 'RPC access identity name, unique within the organization (the token sub)', example: dapp-web }
        permissions:
          type: array
          description: Besu permission strings (namespace:* or namespace:method); copied as-is into the permissions claim when a token is issued
          items: { type: string }
          example: ['eth:blockNumber', 'eth:call', 'net:version']
        createdAt: { $ref: '#/components/schemas/Timestamp' }

    RpcUserCreate:
      type: object
      required: [username, permissions]
      properties:
        username:
          type: string
          description: Unique within the organization; only letters, digits, - and _; the bsos- prefix is reserved for the platform
          example: dapp-web
        permissions:
          type: array
          description: Permission strings picked from the method catalog (namespace:* or namespace:method); the backend validates them against the catalog as an allowlist
          minItems: 1
          items: { type: string }
          example: ['eth:blockNumber', 'eth:sendRawTransaction', 'net:version']

    RpcTokenRequest:
      type: object
      description: Give exactly one of ttl and expiresAt.
      properties:
        ttl:
          type: string
          enum: [1h, 24h, 7d, 30d, 365d]
          description: Token lifetime. There is no "forever" because Besu requires exp; a leaked long-lived token works until it expires, so the UI defaults to 7d
          x-enum-varnames: [RpcTokenTtl1h, RpcTokenTtl24h, RpcTokenTtl7d, RpcTokenTtl30d, RpcTokenTtl365d]
        expiresAt:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: Explicit expiry time; must be in the future and at most 1 year ahead
        label:
          type: string
          maxLength: 64
          description: Purpose (optional), e.g. "production"; at most 64 characters after trimming whitespace, and empty means none

    RpcTokenIssued:
      type: object
      required: [token, tokenId, label, expiresAt, permissions]
      properties:
        tokenId:
          type: string
          description: Id generated for this issuance (tk_ + 12 hex characters), written into the JWT jti; the history stores the same value
          example: tk_7f3a9c2be104
        label: { type: string, nullable: true, description: 'Purpose given at issuance; null if none' }
        token:
          type: string
          description: JWT (RS256). Appears only once, in this response; the platform does not keep it, so issue a new one if it is lost
        expiresAt: { $ref: '#/components/schemas/Timestamp' }
        permissions:
          type: array
          description: Permissions actually carried by this token (the user's permissions at issuance)
          items: { type: string }

    RpcUserEvent:
      type: object
      description: An activity record of an RPC access identity.
      required: [id, kind, at, actor, permissions]
      properties:
        id: { type: integer, format: int64 }
        kind:
          type: string
          enum: [created, token_issued]
          x-enum-varnames: [RpcUserEventCreated, RpcUserEventTokenIssued]
        at: { $ref: '#/components/schemas/Timestamp' }
        actor: { type: string, description: 'Who performed it (login account); empty string when unknown' }
        permissions:
          type: array
          description: created = permissions at creation; token_issued = permissions carried by the token
          items: { type: string }
        expiresAt:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: token_issued only - the token's expiry
        tokenId: { type: string, nullable: true, description: 'token_issued only - the token id (JWT jti)' }
        label: { type: string, nullable: true, description: 'token_issued only - the purpose given at issuance' }

    AgentRuntime:
      type: string
      enum: [systemd, docker]
      description: How the agent runs on its host. docker = inside a container (the install script's Docker mode); systemd = directly on the host
      x-enum-varnames: [AgentRuntimeSystemd, AgentRuntimeDocker]

    AgentStatus:
      type: object
      description: >
        The agent's GET /agent-status (tunnel only, not a platform API). Every round the platform asks with the P2P port from this node's enode.
      required: [version, p2pOpen]
      properties:
        version: { type: string, description: 'Agent build version', example: '2.0.0' }
        runtime: { $ref: '#/components/schemas/AgentRuntime' }
        p2pOpen:
          type: boolean
          nullable: true
          description: Whether anything listens on the given P2P port on 127.0.0.1 or any interface IP; null when no port was given or the port is not in ALLOW_PORTS

    NodeLogs:
      type: object
      description: A slice of the agent's log buffer. seq increases monotonically within an epoch; after an agent restart the epoch changes and seq starts again from 1.
      required: [epoch, connected, lines, next, skipped]
      properties:
        epoch:
          type: integer
          format: int64
          description: Id of this agent run; if it differs from the last one received, the agent has restarted and the frontend clears and refetches (without after)
        connected:
          type: boolean
          description: Whether Besu is currently connected to the agent's log input
        lines:
          type: array
          items: { $ref: '#/components/schemas/NodeLogLine' }
        skipped:
          type: integer
          format: int64
          description: >
            Number of lines after after and before the first line of this batch that were evicted from the agent buffer and are lost (only the latest ~2 MB is kept);
            0 = contiguous, nothing lost. The frontend uses it to mark the gap as "about N lines overwritten". Always 0 without after.
        next:
          type: integer
          format: int64
          description: The after to send on the next poll (the seq of the last line in this batch, or the given after when there are no new lines)

    NodeLogLine:
      type: object
      required: [seq, text]
      properties:
        seq: { type: integer, format: int64 }
        text: { type: string, description: 'The raw line (not parsed; anything beyond 64 KB is truncated)' }

    NodeLogBlocks:
      type: object
      description: >
        Response of the agent's GET /logblocks?after=<epoch>.<seq> (tunnel only, not a platform API; the Enterprise platform pulls it for long-term retention).
        Ascending by (epoch, seqLast), with a cap on the total size per call; more = true means there is more and the platform pulls again right away.
      required: [agentNow, more, blocks]
      properties:
        agentNow:
          type: string
          format: date-time
          description: The agent's clock at response time (the platform uses it to compute clock skew)
        more: { type: boolean }
        blocks:
          type: array
          items: { $ref: '#/components/schemas/NodeLogBlock' }

    NodeLogBlock:
      type: object
      description: >
        A sealed log block - zstd-compressed JSON Lines, each line {"s": sequence, "t": receive time, "l": raw text} or {"s", "t", "mark": {...}}.
        Sequence numbers are contiguous within an epoch; epoch is a persistent counter the agent increments on every start.
      required: [epoch, seqFirst, seqLast, recvFirst, recvLast, sha256, data]
      properties:
        epoch: { type: integer, format: int64 }
        seqFirst: { type: integer, format: int64 }
        seqLast: { type: integer, format: int64 }
        recvFirst: { type: string, format: date-time }
        recvLast: { type: string, format: date-time }
        sha256: { type: string, description: 'SHA-256 of the compressed bytes (hex)' }
        data: { type: string, format: byte, description: 'zstd-compressed bytes (base64)' }

    NodeCapabilities:
      type: object
      description: >
        Whether the prerequisites of each platform feature layer are met. Agent connected = node online with host metrics; RPC connected = chain state, identity, voting,
        peer pushing, account allowlist and log level; metrics connected = time-series charts and chain alerts.
      required: [agent, rpcReachable, rpcUnauthorized, missingRpcApis, allowlistEnabled, metricsReachable, logsConnected]
      properties:
        agent:
          type: boolean
          description: The agent is currently connected to the platform
        rpcReachable:
          type: boolean
          nullable: true
          description: >
            The platform can reach the node RPC through the agent (127.0.0.1:<rpcPort>); null = agent offline, unknown.
            When false, check rpcUnauthorized to tell rejection from no response (Besu not running, RPC disabled or not listening on loopback, or a port different from the platform's record).
        rpcUnauthorized:
          type: boolean
          description: The node returned 401 - the node is not configured with this platform's RPC public key, or the clocks differ too much
        missingRpcApis:
          type: array
          items: { type: string }
          description: >
            RPC namespaces the platform uses but the node has not enabled (NET / ADMIN / TXPOOL / PERM; IBFT/QBFT when neither consensus namespace responds).
            NET and IBFT/QBFT are required; ADMIN, TXPOOL and PERM are optional, and leaving them off only loses the matching features, which is not an error.
            Empty array when RPC is unreachable.
          example: [PERM]
        allowlistEnabled:
          type: boolean
          nullable: true
          description: >
            Whether the node has the account allowlist file enabled (permissions-accounts-config-file-enabled).
            null = unknown (RPC unreachable, or the PERM namespace is not enabled; see missingRpcApis).
        metricsReachable:
          type: boolean
          nullable: true
          description: Whether the platform's Prometheus last scraped this node's Besu metrics successfully; null = not scraped yet or the platform has no Prometheus
        logsConnected:
          type: boolean
          nullable: true
          description: >
            Whether Besu is currently sending logs to the agent; null = the platform could not ask this round (agent offline, or the agent did not answer the log-status request).
            Logs are optional - false usually means they are not configured (Besu has no LOG4J_CONFIGURATION_FILE), but the address in the config file may also differ from where the agent listens.
        agentVersion:
          type: string
          nullable: true
          description: Build version reported by this agent (same format as agentVersion in GET /platform/agent-bundle); null when the agent is offline or did not report this round
          example: '2.0.0'
        agentRuntime:
          allOf: [{ $ref: '#/components/schemas/AgentRuntime' }]
          nullable: true
          description: How this agent runs, as it last reported it (kept while the agent is offline, which is when a re-join is needed); null when it has never reported it

    BesuRunning:
      type: boolean
      nullable: true
      description: >
        Whether Besu is running. true = RPC is reachable, or the agent detects a listener on the P2P port from this node's enode;
        false = neither works and a listener was seen on that port before (when status is rpc_unreachable, the UI shows "Offline (Besu stopped)");
        null = agent offline, port not known yet, or no listener ever seen on that port. Included by cross-organization endpoints (same as status)

    RpcAuthEnabled:
      type: boolean
      nullable: true
      description: Whether the node RPC has authentication enabled (the platform probes the node RPC through the agent tunnel with a call without a token - 401 = enabled, 200 = disabled; every round while disabled, less often once enabled); null when unknown. Authentication is managed by the node operator; the platform only displays it and does not enforce it

    RpcPublicKey:
      type: object
      required: [algorithm, publicKeyPem, sha256]
      properties:
        algorithm: { type: string, example: RS256, description: 'Value for Besu''s --rpc-http-authentication-jwt-algorithm' }
        publicKeyPem: { type: string, description: 'PEM (PUBLIC KEY); save it to a file as-is for Besu' }
        sha256: { type: string, description: 'SHA-256 of the public key DER (hex), for verifying on both sides' }

    AgentBundleInfo:
      type: object
      required: [installShSha256]
      properties:
        installShSha256: { type: string, description: 'SHA-256 of the install.sh served by the platform (hex)' }
        agentVersion: { type: string, nullable: true, description: 'Agent version (.version in AGENT_BINARY_DIR); null when absent' }
        bundle:
          allOf: [{ $ref: '#/components/schemas/AgentBundle' }]
          nullable: true
          description: Offline bundle; null when the platform has no agent binaries (AGENT_BINARY_DIR unset or empty)

    AgentBundle:
      type: object
      required: [file, sha256, arches]
      properties:
        file: { type: string, example: besu-agent-2.0.0-linux.tar.gz }
        sha256: { type: string }
        arches:
          type: array
          description: Architectures of the agent binaries in the bundle
          items: { type: string, enum: [amd64, arm64] }

    RpcMethodCatalog:
      type: array
      description: Besu RPC method catalog (maintained by the platform; source for the checkbox list and the backend's permission-validation allowlist; follows the Besu version).
      items: { $ref: '#/components/schemas/RpcNamespaceCatalog' }

    RpcNamespaceCatalog:
      type: object
      description: A Besu namespace and its selectable methods.
      required: [namespace, description, methods]
      properties:
        namespace: { type: string, description: 'Besu namespace (e.g. eth/net/web3)', example: eth }
        description: { type: string, description: 'Short description of the namespace' }
        methods:
          type: array
          items: { $ref: '#/components/schemas/RpcCatalogMethod' }

    RpcCatalogMethod:
      type: object
      description: A single method in the catalog (name without the namespace prefix).
      required: [method, description]
      properties:
        method: { type: string, description: 'Method name (without the namespace prefix)', example: blockNumber }
        description: { type: string, description: 'Short description of the method' }

    # ── Errors ─────────────────────────────────────────────
    ErrorReason:
      type: string
      description: >
