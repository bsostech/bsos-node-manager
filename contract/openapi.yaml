        email: { type: string, description: 'Optional; a single email address (without a display name). Cannot be changed after creation' }
        sendEmail: { type: boolean, description: 'Mail the temporary password to email instead of returning it in the response; omitted = do not send' }

    PasswordDelivery:
      type: string
