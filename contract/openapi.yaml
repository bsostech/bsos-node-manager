openapi: 3.0.3

# ─────────────────────────────────────────────────────────────
# BSOS node management tool - API contract (single source of truth)
# Shared by the frontend (MSW mocks + openapi-typescript types) and the backend (Go)
# ─────────────────────────────────────────────────────────────

info:
  title: BSOS Node Manager API
  version: 0.1.0
  description: >
    The API the platform frontend talks to (frontend <-> this organization's platform). Covers my nodes, node details, time series and operations.
    Cross-organization read-only access (access keys / external organizations) is in the Enterprise edition.

servers:
  - url: /api/v1
    description: Same origin as the web UI (the frontend's mock mode intercepts it with MSW)

tags:
  - name: nodes
    description: Node list, details and operations
  - name: metrics
    description: Time series (for charts)
  - name: join-tokens
    description: Node enrollment (issuing and viewing join tokens)
  - name: alerts
    description: Prometheus/Alertmanager alerts. Writes arrive through the Alertmanager webhook, which is outside this contract

paths:
  /nodes:
    get:
      tags: [nodes]
      summary: List this organization's nodes
      operationId: listNodes
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [nodes, asOf]
                properties:
                  nodes:
                    type: array
                    items: { $ref: '#/components/schemas/NodeSummary' }
                  asOf: { $ref: '#/components/schemas/Timestamp' }
                  dataAgeSec:
                    type: number
                    nullable: true
                    description: Age in seconds, at response time, of the oldest node data in this list (computed server-side, unaffected by the browser clock). null when no node has been sampled yet

  /nodes/{id}:
    get:
      tags: [nodes]
      summary: Get node details
      operationId: getNode
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeDetail' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [nodes]
      summary: Delete a node (revokes all its valid certificates so the agent disconnects within 5s; removes the node record and settings)
      description: >
        Platform-side offboarding. Revokes every unexpired leaf certificate of the node (the deny-list watcher closes an online agent's connection within seconds) and deletes the node record
        and its entries in custom peer lists, and revokes its unused join tokens. RPC access identities are shared across the organization and are not deleted. The Besu process on the VM is not affected; to remove the agent completely, run sudo /usr/local/sbin/bsos-uninstall on that machine.
      operationId: deleteNode
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Deleted (no content)
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/cert:
    get:
      tags: [nodes]
      summary: Get node certificate and connection status (top of the node settings page)
      operationId: getNodeCert
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeCertStatus' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/series:
    get:
      tags: [metrics]
      summary: Get time series for one node (charts)
      operationId: getNodeSeries
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/SeriesMetric'
        - $ref: '#/components/parameters/SeriesRange'
        - $ref: '#/components/parameters/SeriesFrom'
        - $ref: '#/components/parameters/SeriesTo'
        - $ref: '#/components/parameters/SeriesStep'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MetricSeries' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: No time series to query - Prometheus is not configured (PROMETHEUS_URL, reason monitoring_not_configured) or cannot be reached (reason monitoring_down)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/peers:
    get:
      tags: [nodes]
      summary: List the peers this node is currently connected to (read from the node's own admin_peers; only peers that completed the handshake are listed). monitor:view is enough to see them, including public key, enode and remote address; cross-organization forwarding has no logged-in user and omits those three fields
      operationId: listNodePeers
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodePeers' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/txpool:
    get:
      tags: [nodes]
      summary: Snapshot of this node's transaction pool (node RPC is queried live only while the tab is open; the platform stores nothing)
      description: |
        Calls txpool_besuStatistics / besuTransactions / besuPendingTransactions and each account's
        eth_getTransactionCount(latest) through the agent tunnel, groups by account and returns the top 200 accounts by transaction count.
        With from, only that address is queried (filtered on the node) and the 200 limit does not apply. Transaction bodies (input, raw, value) are not returned.
        Limited to this organization's nodes; monitor:view is enough. Not audited (the open tab polls every few seconds).
      operationId: getNodeTxPool
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: from
          in: query
          required: false
          description: Only query this sender address (0x + 40 hex)
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeTxPool' }
        '400':
          description: from is not an address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found or not in this organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Transaction pool unavailable (agent offline, RPC unreachable, or TXPOOL not enabled on the node)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /shared-peers:
    get:
      tags: [nodes]
      summary: Connection state of the shared list, per-node usage, and candidates that can be added to the list
      description: |
        Data comes from the admin_peers the platform reads from each node every round; no extra RPC is made.
        The shared list is what the platform pushes every round to nodes with "Use shared list" turned on: the list the user entered, minus the receiving node itself and this organization's quarantined nodes.
      operationId: listSharedPeers
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedPeers' }

  /manual-peers:
    post:
      tags: [nodes]
      summary: Add to the shared list. The platform does not judge who the peer is or whether to connect; that is the user's responsibility (it may be a node of this organization, with the address supplied by the user)
      operationId: createManualPeer
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPeerCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManualPeer' }
        '400':
          description: Malformed enode, or the list is full
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The same public key is already in the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /manual-peers/{pubkey}:
    delete:
      tags: [nodes]
      summary: Remove from the shared list (the next round calls admin_removePeer on nodes using the shared list)
      operationId: deleteManualPeer
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: pubkey
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9a-fA-F]{128}$' }
      responses:
        '204':
          description: Removed
        '404':
          description: Public key not in the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/custom-peers:
    get:
      tags: [nodes]
      summary: Extra peers for this node, i.e. the use-shared-list switch and peers added to this node directly
      operationId: getNodeCustomPeers
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeCustomPeers' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [nodes]
      summary: Add a peer directly to this node (may be a node of this organization but not this node itself; allowed whether or not the switch is on; admin_addPeer runs next round)
      operationId: createNodeCustomPeer
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManualPeerCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomPeer' }
        '400':
          description: Malformed enode, the enode is this node itself, or the list is full
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The same public key is already among this node's directly added peers, or this node uses the shared list and the key is already in it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/custom-peers/{pubkey}:
    delete:
      tags: [nodes]
      summary: Remove from this node's directly added peers (admin_removePeer runs next round)
      operationId: deleteNodeCustomPeer
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: pubkey, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{128}$' } }
      responses:
        '204':
          description: Removed
        '404':
          description: Public key not in the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/peer-shared:
    put:
      tags: [nodes]
      summary: >
        Set whether this node uses the shared list. The setting is saved first, then admin_addPeer / admin_removePeer is pushed to this node once right away; a failed push is not an error,
        the next background round (within 30 seconds) resends it anyway. Directly added peers are untouched. The push happens even if the value did not change
      operationId: setNodePeerShared
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeerSharedRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeCustomPeers' }
        '400':
          description: Empty body
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /peer-names/{address}:
    put:
      tags: [nodes]
      summary: Name a node, keyed by address (the peers page derives the address from the public key and the validators page uses the address directly, so both show the same name)
      operationId: setPeerName
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeerNameRequest' }
      responses:
        '204':
          description: Set
        '400':
          description: Invalid address or name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This address belongs to a node of this organization; name those nodes with PUT /nodes/{id}/name instead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [nodes]
      summary: Clear a node's name
      operationId: deletePeerName
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      responses:
        '204':
          description: Cleared (also returns 204 when there was no name)
        '400':
          description: Invalid address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/alerts:
    get:
      tags: [alerts]
      summary: Get alerts for one node (local alerts table)
      operationId: getNodeAlerts
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /fleet/status:
    get:
      tags: [metrics]
      summary: Nodes whose agent the platform cannot reach (lists only nodes that have been unreachable for at least 10 minutes)
      description: >
        Per-node source status, so the "My nodes" status bar / legend can state it once instead of showing red text on every chart.
        Decided from the collector's own polling of each agent, not from Prometheus. A node that has never connected, or that has been unreachable for less than 10 minutes, is not listed.
        `since` is when the node stopped answering (kept on the server, so a reload does not reset it).
      operationId: getFleetStatus
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FleetNodeStatus' }

  /nodes/{id}/logs:
    get:
      tags: [nodes]
      summary: Recent Besu logs of a node (read from the agent's in-memory buffer through the agent tunnel; the platform stores nothing)
      description: |
        Besu sends its logs to the agent on the same machine using the log4j2 config the platform provides; the agent keeps only the latest ~2 MB.
        The frontend polls with the previous `next` as `after` to fetch only new lines. Limited to this organization's nodes; monitor:view is enough.
      operationId: getNodeLogs
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - name: after
          in: query
          required: false
          description: Only return lines with seq greater than this value. When omitted, the latest limit lines are returned (used when the log view is first opened)
          schema: { type: integer, format: int64, minimum: 0 }
        - name: limit
          in: query
          required: false
          description: Maximum number of lines (1-1000, default 500). With after, if there are more new lines than this, the earliest ones are returned and the frontend continues with next
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeLogs' }
        '404':
          description: Node not found or not in this organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Agent offline, or the agent failed to return its logs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/log-level:
    put:
      tags: [nodes]
      summary: Change a node's log level (admin_changeLogLevel; takes effect immediately but is not persisted, and a Besu restart reverts to logging in config.toml)
      operationId: setNodeLogLevel
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeLogLevelRequest' }
      responses:
        '204':
          description: Applied by the node
        '400':
          description: Invalid level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found or not in this organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Node offline or refused (message carries the reason, e.g. the ADMIN namespace is not enabled)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/name:
    put:
      tags: [nodes]
      summary: Set the display name of a node in this organization (non-ASCII such as Chinese allowed; the node id does not change)
      operationId: setNodeName
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeNameRequest' }
      responses:
        '204':
          description: Updated
        '400':
          description: Name longer than 64 characters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found or not in this organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/ports:
    put:
      tags: [nodes]
      summary: Change the node's local RPC and metrics ports (the targets the platform forwards to through the agent tunnel)
      description: |
        The agent does not know which ports Besu listens on, so every forwarded request carries X-Target: 127.0.0.1:<port>. Both values are set when the join token is created (default 8545 / 9545).
        If Besu's ports change, update them here, otherwise the platform cannot read node status (RPC) or scrape chain metrics (metrics).
      operationId: setNodePorts
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodePortsRequest' }
      responses:
        '204':
          description: Updated
        '400':
          description: Port not in 1-65535
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found or not in this organization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /rpc-users:
    get:
      tags: [nodes]
      summary: List this organization's RPC access identities (named sets of method permissions, shared across the organization; the platform stores no passwords, you issue a token to use one)
      description: |
        The platform has a single signing key and a token works on every node in this organization that has authentication enabled, so users exist once per organization and are not tied to a node.
        The list does not include token counts or expiry; read `/rpc-users/{id}/events` for issuance history.
      operationId: listRpcUsers
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RpcUser' }
    post:
      tags: [nodes]
      summary: Create an RPC access identity (stores only the name and method permissions; tokens are issued separately via /token)
      operationId: createRpcUser
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpcUserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpcUser' }
        '400':
          description: Reserved or invalid user name, or a permission string not in the method catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: An RPC access identity with this name already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /rpc-users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    delete:
      tags: [nodes]
      summary: Delete an RPC access identity and its history (no further tokens are issued; nodes still accept already issued tokens until exp)
      operationId: deleteRpcUser
      security: [{ bearerAuth: ["nodes:onboard"] }]
      responses:
        '204':
          description: Deleted
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /rpc-users/{id}/token:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      tags: [nodes]
      summary: Issue a JWT for this user (RS256 with the platform private key; permissions = the user's current method permissions; exp is required because Besu rejects tokens without exp)
      description: |
        The token appears only once, in this response, and the platform does not keep it. JWTs are stateless: once issued, nodes accept it until exp and the platform cannot revoke it.
        Deleting the user only affects tokens issued afterwards (method permissions never change after creation). Tokens carry no aud, so every node in this organization with authentication enabled accepts them.
      operationId: issueRpcUserToken
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RpcTokenRequest' }
      responses:
        '200':
          description: Issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpcTokenIssued' }
        '400':
          description: Not exactly one of ttl and expiresAt given, invalid ttl, expiresAt in the past or more than 1 year ahead, or purpose longer than 64 characters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /rpc-users/{id}/events:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      tags: [nodes]
      summary: Activity history of an RPC access identity (creation, token issuance; newest first)
      description: |
        History belongs to the user: it is deleted with the user, and a user recreated later under the same name gets a new id and does not inherit the old history. The token itself is never stored.
      operationId: listRpcUserEvents
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RpcUserEvent' }
        '404':
          description: User not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /platform/rpc-public-key:
    get:
      tags: [nodes]
      summary: Public key the platform uses to sign node RPC tokens (public endpoint; node operators point Besu's --rpc-http-authentication-jwt-public-key-file at it)
      description: |
        Makes no assumption about how nodes are deployed. The platform provides only the public key and fingerprint; node operators decide whether to pass the path to Besu via a CLI flag, an environment variable or config.toml.
        The same content is also available as plain text at `/api/v1/platform/rpc-public-key.pem` (for saving directly with curl -o).
      operationId: getPlatformRpcPublicKey
      security: [] # no login required (also listed in auth.isPublic)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpcPublicKey' }

  /platform/agent-bundle:
    get:
      tags: [nodes]
      summary: Agent installation info (install.sh checksum, offline bundle file name and checksum)
      description: |
        Used by the onboarding page to build the install command. Online installs verify install.sh against installShSha256 before running it; the offline bundle is downloaded from
        `/api/v1/platform/agent-bundle.tar.gz` (contains install.sh, upgrade-agent.sh, the agent for each architecture, and SHA256SUMS).
        Bundles built from the same agent files are byte-for-byte identical every time, so the sha256 given here is the hash of the downloaded file.
      operationId: getAgentBundle
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentBundleInfo' }

  /rpc-method-catalog:
    get:
      tags: [nodes]
      summary: Besu RPC method catalog (source for the checkbox list and the backend's permission-validation allowlist; follows the Besu version)
      operationId: getRpcMethodCatalog
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RpcMethodCatalog' }

  /join-tokens:
    get:
      tags: [join-tokens]
      summary: List join tokens (secrets excluded)
      operationId: listJoinTokens
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JoinToken' }
    post:
      tags: [join-tokens]
      summary: Create a join token (single use; the secret appears only once, in this response)
      description: >
        A node keeps at most one unused join token. Creating one revokes the same node's other unused tokens (pending, including ones past
        expiry) in the same transaction, each recorded as superseded by the new token.
      operationId: createJoinToken
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinTokenCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinTokenCreated' }
        '400':
          description: Invalid nodeId format
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /join-tokens/{id}/revoke:
    post:
      tags: [join-tokens]
      summary: Revoke a join token (pending or expired tokens can both be revoked; the record is kept)
      operationId: revokeJoinToken
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JoinToken' }
        '404':
          description: Token not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Token already used or revoked (including a join that completed while this request was in flight); cannot be revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /chain:
    get:
      tags: [nodes]
      summary: Chain-level info (taken from this organization's healthy node with the highest block height)
      operationId: getChainInfo
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChainInfo' }

  /chain/nodes:
    get:
      tags: [nodes]
      summary: Nodes on the chain (validator set ∪ this organization's nodes ∪ nodes seen in their admin_peers), validators first
      operationId: listChainNodes
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChainNode' }

  # ── Validator admission votes (read-only on-chain state + voting on our own validator nodes) ──
  /validators:
    get:
      tags: [validators]
      summary: Current validator set (read-only, aggregated from the consensus state each node reports)
      operationId: listValidatorSet
      security: [{ bearerAuth: ["validators:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ValidatorSetEntry' }

  /validator-votes:
    get:
      tags: [validators]
      summary: Changes under vote, i.e. votes written into blocks this epoch (network-wide) plus votes our own nodes have cast that are not yet in a block, grouped by target address and direction. Once a change takes effect it shows in the validator set and the row disappears
      operationId: listValidatorVotes
      security: [{ bearerAuth: ["validators:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidatorVotes' }
    post:
      tags: [validators]
      summary: Cast a vote on each of our own validator nodes (*_proposeValidatorVote). No record is created and nothing is re-voted in the background; other organizations vote on their own platforms
      operationId: proposeValidatorVote
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidatorVoteRequest' }
      responses:
        '200':
          description: Per-node results (an individual failure does not fail the whole request)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidatorVoteResult' }
        '400':
          description: Malformed address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This organization has no validator nodes, no node reported a consensus type, or the direction matches the current state (adding an address that is already a validator, or removing one that is not)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /validator-votes/history:
    get:
      tags: [validators]
      summary: Finished validator votes, newest first (recorded by the platform from on-chain votes, starting from the epoch in which the platform began watching)
      operationId: listValidatorVoteHistory
      security: [{ bearerAuth: ["validators:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ValidatorVoteRecord' }

  /validator-votes/{address}:
    delete:
      tags: [validators]
      summary: Withdraw this organization's vote for this address on each of our own validator nodes
      description: >
        A node whose vote is not yet in a block drops it from its pending votes (*_discardValidatorVote).
        A node whose vote was already written into a block in this epoch, and so is already counted, casts the opposite vote instead (*_proposeValidatorVote with the other direction) to cancel it.
      operationId: discardValidatorVote
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      responses:
        '200':
          description: Per-node results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidatorVoteResult' }
        '400':
          description: Malformed address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This organization has no validator nodes, or no node reported a consensus type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alerts:
    get:
      tags: [alerts]
      summary: List this organization's alerts (Prometheus rules -> Alertmanager -> stored via webhook ingestion)
      operationId: listAlerts
      security: [{ bearerAuth: ["monitor:view"] }]
      parameters:
        - name: status
          in: query
          description: Filter by firing/resolved; all when omitted
          schema: { $ref: '#/components/schemas/AlertStatus' }
        - name: nodeId
          in: query
          description: Only alerts for this node
          schema: { type: string }
        - name: alertname
          in: query
          description: Only alerts for this rule (AlertRule.alertname)
          schema: { type: string }
        - name: since
          in: query
          description: Only alerts still firing after this time or resolved after it
          schema: { $ref: '#/components/schemas/Timestamp' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertList' }

  /alerts/read:
    post:
      tags: [alerts]
      summary: >
        Mark the current entry of each of these alerts as read by the current user. A firing alert marks its firing entry; a resolved alert marks both its firing and resolved entries.
        Unknown or malformed ids are ignored
      operationId: markAlertsRead
      security: [{ bearerAuth: ["monitor:view"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertReadRequest' }
      responses:
        '204':
          description: Marked
        '400':
          description: Empty body

  /alerts/read-all:
    post:
      tags: [alerts]
      summary: Mark all alerts within the retention period as read by the current user (according to each alert's state)
      operationId: markAllAlertsRead
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '204':
          description: Marked

  /alert-settings:
    get:
      tags: [alerts]
      summary: Current alert notification settings (the SMTP password is never returned). Without nodes:onboard, webhook urls are empty strings (only the number of webhooks is visible)
      operationId: getAlertSettings
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }

  /alert-settings/smtp:
    put:
      tags: [alerts]
      summary: >
        Configure and enable Email (SMTP) notifications (nodes:onboard). Only SMTP changes; the webhook list is untouched.
        Notification settings are split into one endpoint per channel so that changing one channel does not require resending another channel's settings.
        password is required when username is set; without a username (a relay that takes no login) it may be empty and is not stored.
        "Leave blank to keep the current password" is not supported; the full settings are sent every time so the operator never has to guess which password is stored.
      operationId: putAlertSettingsSmtp
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmtpSettings' }
      responses:
        '200':
          description: Saved; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '400':
          description: Invalid settings (username set without a password / missing required fields)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Couldn't save on the server side (database, encryption, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [alerts]
      summary: Disable Email (SMTP) notifications and clear the stored settings (nodes:onboard). The webhook list is not affected.
      operationId: deleteAlertSettingsSmtp
      security: [{ bearerAuth: ["nodes:onboard"] }]
      responses:
        '200':
          description: Disabled; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '500':
          description: Couldn't save on the server side (database, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/webhooks:
    put:
      tags: [alerts]
      summary: >
        Replace the whole custom webhook list (nodes:onboard). Only webhooks change; SMTP settings are untouched.
        Sending an empty array clears all webhooks.
      operationId: putAlertSettingsWebhooks
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/AlertWebhookUrl' }
      responses:
        '200':
          description: Saved; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '400':
          description: Invalid settings (empty label / url, or malformed URL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Couldn't save on the server side (database, encryption, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/telegram:
    put:
      tags: [alerts]
      summary: >
        Configure and enable Telegram notifications (nodes:onboard). Only Telegram changes; other channels are not affected.
        botToken is required for the same reason as the SMTP password: "leave blank to keep the current token" is not supported.
      operationId: putAlertSettingsTelegram
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramSettings' }
      responses:
        '200':
          description: Saved; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '400':
          description: Invalid settings (missing botToken / chatId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Couldn't save on the server side (database, encryption, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [alerts]
      summary: Disable Telegram notifications and clear the stored settings (nodes:onboard).
      operationId: deleteAlertSettingsTelegram
      security: [{ bearerAuth: ["nodes:onboard"] }]
      responses:
        '200':
          description: Disabled; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '500':
          description: Couldn't save on the server side (database, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/slack:
    put:
      tags: [alerts]
      summary: >
        Configure and enable Slack notifications (nodes:onboard). Only Slack changes; other channels are not affected.
        webhookUrl is required (the URL itself is the credential and GET never returns it); the host must be hooks.slack.com or hooks.slack-gov.com.
      operationId: putAlertSettingsSlack
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlackSettings' }
      responses:
        '200':
          description: Saved; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '400':
          description: Invalid settings (missing webhookUrl, or not an https://hooks.slack.com/ or https://hooks.slack-gov.com/ URL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Couldn't save on the server side (database, encryption, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [alerts]
      summary: Disable Slack notifications and clear the stored settings (nodes:onboard).
      operationId: deleteAlertSettingsSlack
      security: [{ bearerAuth: ["nodes:onboard"] }]
      responses:
        '200':
          description: Disabled; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '500':
          description: Couldn't save on the server side (database, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/locale:
    put:
      tags: [alerts]
      summary: >
        Set the language and time zone of alert notifications (nodes:onboard). Platform-wide: every channel uses them,
        and the default rules' summaries and descriptions are written in the same language. Saving rewrites alertmanager.yml,
        and a language change also rewrites the Prometheus rules file; channels are not affected.
      operationId: putAlertSettingsLocale
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertLocale' }
      responses:
        '200':
          description: Saved; returns the full updated notification settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '400':
          description: Invalid settings (unknown language, or a non-empty time zone that is not an IANA name)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Couldn't save on the server side (database, encryption, writing alertmanager.yml or the rules file); reason alert_settings_save_failed with params.detail, nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/test-smtp:
    post:
      tags: [alerts]
      summary: >
        Test the SMTP connection (nodes:onboard, same as PUT /alert-settings/smtp). Only does a TCP connection plus credential check
        and sends no mail, because testing settings should not bother real recipients. It connects with the chosen `security` and picks the
        AUTH mechanism the way Alertmanager does (the first of the server's advertised mechanisms it knows), so a passing test means
        Alertmanager can send with the same settings.
        It uses the current form contents, not the saved settings,
        so there is no need to click "Save" before testing.
      operationId: testAlertSettingsSmtp
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmtpSettings' }
      responses:
        '204':
          description: Connection and authentication both succeeded
        '400':
          description: Unreachable, handshake failed, or credentials rejected (message carries the raw error so the operator can tell whether the host, port or credentials are wrong)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/test-webhook:
    post:
      tags: [alerts]
      summary: >
        Test a webhook connection (nodes:onboard, same as PUT /alert-settings/webhooks). Only does a TCP connection plus (for https) a TLS handshake
        and sends no HTTP request. Alertmanager actually sends its own webhook JSON schema, not the Slack {text:...}
        format, and what the remote server does with a payload is beyond our control; stopping at the connection layer is the only way to guarantee no visible action is triggered.
        It uses the current form contents, so there is no need to click "Save" before testing.
      operationId: testAlertSettingsWebhook
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertWebhookUrl' }
      responses:
        '204':
          description: TCP connection (and TLS handshake for https) succeeded
        '400':
          description: Malformed URL, unreachable, or TLS handshake failed (message carries the raw error)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/test-telegram:
    post:
      tags: [alerts]
      summary: >
        Test the Telegram settings (nodes:onboard). Verifies the bot token, then sends a test message to the chat.
        Unlike webhooks, which only test the connection, Telegram has a fixed format, and actually sending a message is the only way to confirm the bot has joined the group.
        It uses the current form contents, so there is no need to save first.
      operationId: testAlertSettingsTelegram
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramSettings' }
      responses:
        '204':
          description: Test message sent
        '400':
          description: Invalid token, chat not found, bot not in the group, or Telegram unreachable (message says which)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-settings/test-slack:
    post:
      tags: [alerts]
      summary: >
        Test the Slack webhook (nodes:onboard). Sends a test message to the webhook. It uses the current form contents, so there is no need to save first.
      operationId: testAlertSettingsSlack
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SlackSettings' }
      responses:
        '204':
          description: Test message sent
        '400':
          description: Malformed URL, unreachable, or rejected by Slack (message carries Slack's error code)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-rules:
    get:
      tags: [alerts]
      summary: List alert rules (default rules together with user-added rules)
      operationId: listAlertRules
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRule' }

  /alert-rules/{id}:
    put:
      tags: [alerts]
      summary: Update an alert rule (full replacement; nodes:onboard). Which fields can change depends on kind; see AlertRuleUpdateRequest
      operationId: updateAlertRule
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertRuleUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertRule' }
        '400':
          description: Invalid content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Prometheus rejected the new configuration (render/reload failed; the platform has rolled back to the last working configuration)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /alert-rules/restore-defaults:
    post:
      tags: [alerts]
      summary: >
        Restore default rules (nodes:onboard). Default rules are reset to their default values and re-enabled. User-added rules are not affected.
        Default rules cannot be deleted (user-added rules can be deleted in Enterprise), and the platform recreates any missing default rule on every startup.
      operationId: restoreDefaultAlertRules
      security: [{ bearerAuth: ["nodes:onboard"] }]
      responses:
        '200':
          description: Restored; returns all rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AlertRule' }
        '500':
          description: Prometheus rejected the new rules (the platform has rolled back to the last working configuration)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Identity / permissions (AuthN + RBAC) ──────
  /auth/config:
    get:
      tags: [auth]
      summary: Login page settings (whether to show the password form and the SSO button)
      operationId: getAuthConfig
      security: [] # no login required (also listed in auth.isPublic)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthConfig' }
  /auth/login:
    post:
      tags: [auth]
      summary: Password login (local account, or the LDAP connector when one is set up; sets the session cookie)
      operationId: login
      security: [] # no login required (also listed in auth.isPublic)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: Wrong credentials, or the user's groups map to no role (login refused)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me:
    get:
      tags: [auth]
      summary: Current user (the user resolved by SSO + platform roles + organization)
      operationId: getMe
      security: [{ bearerAuth: ["logged-in"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          description: Not logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Log out (clears the session)
      operationId: logout
      security: [{ bearerAuth: ["logged-in"] }]
      responses:
        '204':
          description: Logged out

  # ── Organization-level Besu account allowlist (file-based; applies to all nodes in this organization) ──
  /permissioning:
    get:
      tags: [nodes]
      summary: Current account allowlist and the detection result for each node
      operationId: getPermissioningPolicy
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissioningPolicy' }
    put:
      tags: [nodes]
      summary: Set the shared account allowlist (after saving, perm_* RPCs are sent right away to nodes using the shared list and the result is read back and compared)
      description: |
        Pushes only to nodes with "Use shared list" turned on, each receiving its own effective list (shared list ∪ addresses added to that node directly); the response's nodes contains only those nodes.
        The list may be empty (leaving only each node's directly added addresses; a node with none rejects all transactions).
        The platform sends each node the difference (perm_addAccountsToAllowlist / perm_removeAccountsFromAllowlist)
        and Besu writes its own permissions file; afterwards perm_getAccountsAllowlist is read back and compared, and each node's result is returned.
        Whether the allowlist is enabled is decided by the node's startup options (permissions-accounts-config-file-enabled and PERM in rpc-http-api);
        the platform has no switch for it and only detects it. Nodes without it enabled report disabled.
      operationId: setPermissioningPolicy
      security: [{ bearerAuth: ["nodes:onboard"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissioningPolicy' }
      responses:
        '200':
          description: Policy saved; per-node apply results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissioningSaveResult' }
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The given revision is not the current one (someone else saved first)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/allowlist:
    put:
      tags: [nodes]
      summary: Set the addresses added directly to this node (on top of the shared list). They are written to the node first and saved only if the read-back matches
      description: |
        A revision of 0 means this node had no directly added addresses; afterwards, send the revision shown on screen.
        When the node uses the shared list, addresses already in the shared list are not stored again; if nothing remains, no list is kept for this node and policyRevision returns 0.
        perm_* RPCs are sent to this node first and read back. A node without it enabled or unreachable returns 409; a node that refuses, or a read-back that still differs, returns 502. Nothing is saved in any of these cases.
      operationId: setNodeAllowlist
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PermissioningPolicy' }
      responses:
        '200':
          description: Saved; apply result for this node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissioningSaveResult' }
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The given revision is not the current one (someone else saved or cleared it first), or this node has no account allowlist enabled or is currently unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The node refused the write (reason is that node's reason, e.g. allowlist_persist_failed), or the read-back after writing still differs; nothing was saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [nodes]
      summary: Clear the addresses added directly to this node. Written to the node first and saved only if the read-back matches (the use-shared-list switch is unchanged)
      operationId: deleteNodeAllowlist
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Cleared; apply result for this node (policyRevision is the shared list's revision)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissioningSaveResult' }
        '404':
          description: Node not found, or this node has no directly added addresses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This node has no account allowlist enabled, or is currently unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The node refused the write, or the read-back after writing still differs; nothing was saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/allowlist/shared:
    put:
      tags: [nodes]
      summary: Set whether this node uses the shared list. Written to the node first and saved only if the read-back matches
      description: |
        When off, this node gets only its directly added addresses (which may be empty, in which case Besu rejects all transactions), and later saves of the shared list are not pushed to it.
        When on, directly added addresses that are already in the shared list are dropped (if nothing remains, no list is kept for this node), and addresses later removed from the shared list are removed from this node too.
        If the value did not change, it is treated as a reapply. policyRevision is the revision of this node's list, or 0 when it has no directly added addresses.
      operationId: setNodeAllowlistShared
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NodeAllowlistSharedRequest' }
      responses:
        '200':
          description: Saved; apply result for this node
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissioningSaveResult' }
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This node has no account allowlist enabled, is currently unreachable, or another platform process changed its list first (policy_stale)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The node refused the write, or the read-back after writing still differs; nothing was saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /nodes/{id}/allowlist/sync:
    post:
      tags: [nodes]
      summary: Reapply, i.e. push the platform's effective list (shared list ∪ directly added) to this node again, adding what is missing and removing what is extra
      operationId: syncNodeAllowlist
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Apply result for this node (policyRevision is the shared list's revision)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissioningSaveResult' }
        '404':
          description: Node not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: This node has no account allowlist enabled, or is currently unreachable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: The node refused the write, or the read-back after writing still differs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /account-names:
    get:
      tags: [nodes]
      summary: Names of allowlisted transaction addresses (the platform's own address book, never written to nodes), as a map of lowercase address -> name, listing only named addresses
      operationId: listAccountNames
      security: [{ bearerAuth: ["monitor:view"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }

  /account-names/{address}:
    put:
      tags: [nodes]
      summary: Name an allowlisted transaction address (saved immediately, independent of applying the list)
      operationId: setAccountName
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeerNameRequest' }
      responses:
        '204':
          description: Set
        '400':
          description: Invalid address or name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [nodes]
      summary: Clear the name of an allowlisted transaction address
      operationId: deleteAccountName
      security: [{ bearerAuth: ["nodes:onboard"] }]
      parameters:
        - name: address
          in: path
          required: true
          schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
      responses:
        '204':
          description: Cleared (also returns 204 when there was no name)
        '400':
          description: Invalid address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/password:
    post:
      tags: [auth]
      summary: Change your own password; the UI calls it only for the forced password change on first login
      operationId: changePassword
      security: [{ bearerAuth: ["logged-in"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChange' }
      responses:
        '204':
          description: Changed (other sessions of this account are logged out as well)
        '400':
          description: The new password does not meet the rules or is the same as the current one (message says which one)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Current password is wrong, or the account is not a local account (SSO accounts have no password here)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login-events:
    get:
      tags: [auth]
      summary: Login history (one entry per login attempt, newest first; not part of the audit log and also available in the open-source edition; kept for 90 days)
      description: |
        Records both password logins (POST /auth/login) and Enterprise OIDC logins. username is null when the account does not exist; what the user typed is not stored.
        The source IP works as in the audit log: it is the connection address, and X-Forwarded-For is trusted only when the connection comes from a proxy in TRUSTED_PROXY_CIDR.
        At most 500 entries are returned per request; beyond that truncated = true (narrow the time range).
      operationId: listLoginEvents
      security: [{ bearerAuth: ["members:manage"] }]
      parameters:
        - { name: since, in: query, required: true, description: 'From this time (inclusive)', schema: { type: string, format: date-time } }
        - { name: username, in: query, required: false, description: 'Only this account', schema: { type: string } }
        - { name: result, in: query, required: false, schema: { $ref: '#/components/schemas/LoginResult' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginEventList' }
        '400':
          description: since is missing or malformed, or result is not success / failure

  /users:
    get:
      tags: [auth]
      summary: List local users
      operationId: listLocalUsers
      security: [{ bearerAuth: ["members:manage"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocalUser' }
    post:
      tags: [auth]
      summary: Create a local user. The temporary password is always generated by the system. By default it appears once in the response for the admin to hand over; with sendEmail it is mailed to email (see GET /account-mail). A password change is forced on first login
      operationId: createLocalUser
      security: [{ bearerAuth: ["members:manage"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalUserCreateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalUserCreated' }
        '400':
          description: Account name or email does not meet the rules, or sendEmail without an email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Account already exists, or sendEmail but no mail server for password emails was configured at deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/{username}:
    patch:
      tags: [auth]
      summary: Disable / enable a user (disabling logs out all of the account's sessions). The role is fixed at creation and cannot be changed
      operationId: updateLocalUser
      security: [{ bearerAuth: ["members:manage"] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalUserUpdateRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalUser' }
        '400':
          description: Missing content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such local user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Would leave the organization without an enabled admin, or targets yourself
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [auth]
      summary: Delete a local user (all logged-in sessions are logged out; audit records are kept separately)
      operationId: deleteLocalUser
      security: [{ bearerAuth: ["members:manage"] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        '204':
          description: Deleted
        '404':
          description: No such local user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Would leave the organization without an enabled admin, or deletes yourself
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /users/{username}/reset-password:
    post:
      tags: [auth]
      summary: Reset a password. The new password is always generated by the system and delivered the same way as for a new user. After a reset all sessions are logged out, a password change is forced on next login, and the failure count is cleared
      operationId: resetLocalUserPassword
      security: [{ bearerAuth: ["members:manage"] }]
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordResetRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PasswordResetResult' }
        '400':
          description: sendEmail but this account has no email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: No such local user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: The account is the caller's own (change your own password with POST /auth/password instead), or sendEmail but no mail server for password emails was configured at deployment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /account-mail:
    get:
      tags: [auth]
      summary: Whether temporary-password emails can be sent (whether ACCOUNT_SMTP_* was set at deployment); returns no settings
      operationId: getAccountMailStatus
      security: [{ bearerAuth: ["members:manage"] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountMailStatus' }

components:
  parameters:
    SeriesMetric:
      name: metric
      in: query
      required: true
      schema: { $ref: '#/components/schemas/MetricId' }
    SeriesRange:
      name: range
      in: query
      description: Relative time range (sliding window counted back from now). A duration string such as 15m / 1h / 6h / 24h / 7d / 3d. Ignored when from+to are given.
      schema:
        type: string
        pattern: '^[0-9]+[mhd]$'
        default: '1h'
    SeriesFrom:
      name: from
      in: query
      description: Absolute window start (epoch seconds). Given together with to, it freezes the window (for drag-to-zoom) and overrides range.
      schema: { type: integer, format: int64 }
    SeriesTo:
      name: to
      in: query
      description: Absolute window end (epoch seconds).
      schema: { type: integer, format: int64 }
    SeriesStep:
      name: step
      in: query
      description: Explicit sampling interval (seconds). Fleet overlay charts use it so multiple nodes share the same time grid. When omitted, the server derives it from the span of range or from/to.
      schema: { type: integer, format: int64, minimum: 15 }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Platform session. Each operation declares the permission it needs as a scope (monitor:view, nodes:onboard, etc.; logged-in means any logged-in user);
        security: [] means no login is required. Operations that declare no scope are always rejected.

  schemas:
    # ── Enums ─────────────────────────────────────────────
    Timestamp:
      type: string
      format: date-time
      description: Time the data was collected (as_of)

    Role:
      type: string
      enum: [viewer, operator, admin]
      description: Platform role

    User:
      type: object
      required: [id, name]
      properties:
        id: { type: string, example: u-alice }
        name: { type: string, example: Alice }
        account:
          type: string
          nullable: true
          description: Display account name from SSO (the LDAP login name; for OIDC, preferred_username, then email, falling back to id). id is the identifier, which for OIDC is the IdP subject and may not be human-readable. null for local accounts
          example: alice@org-a.example

    Me:
      type: object
      description: Current session (after SSO resolution); the frontend derives available permissions from role
      required: [user, role, org]
      properties:
        user: { $ref: '#/components/schemas/User' }
        role: { $ref: '#/components/schemas/Role' }
        org: { type: string, example: org-a }
        mustChangePassword:
          type: boolean
          default: false
          description: true on a local account's first login; the frontend forces a password change before letting the user in
        platformAddr:
          type: string
          nullable: true
          description: mTLS address nodes dial into the platform on (PLATFORM_ADDR, host:port). null when unset (or still the default localhost:8443), in which case the frontend falls back to the browser's host name
          example: platform.org-a:8443
        publicApiBase:
          type: string
          nullable: true
          description: Address nodes use to download installers and reach the platform over HTTP (PUBLIC_API_BASE). null when unset, in which case the frontend falls back to the browser URL
          example: https://platform.org-a

    AuthConfig:
      type: object
      description: Public login page settings (available without logging in); the login page uses them to decide whether to show the password form / SSO button
      required: [passwordLogin, ldapLogin]
      properties:
        passwordLogin:
          type: boolean
          description: Whether to show the password form (local accounts, or password-based SSO such as LDAP)
        ldapLogin:
          type: boolean
          description: Whether password login also goes through LDAP, so a failed sign-in may mean the user's groups map to no role rather than a wrong password
        ssoLoginUrl:
          type: string
          nullable: true
          description: Login entry point for redirect-based SSO (such as OIDC); the login page shows the SSO button only when this is set

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: admin }
        password: { type: string, format: password }

    SmtpSettings:
      type: object
      description: SMTP settings for alert notifications. password is accepted only on PUT and never returned by GET (secrets are write-only)
      required: [host, port, from, to]
      properties:
        host: { type: string, example: smtp.org-a.internal }
        port: { type: integer, example: 587 }
        username: { type: string, nullable: true }
        password: { type: string, format: password, nullable: true }
        security:
          allOf: [{ $ref: '#/components/schemas/SmtpSecurity' }]
          description: Optional on PUT and test; when omitted, port 465 means tls and any other port means none. GET always returns it
        from: { type: string, example: 'alerts@org-a.example' }
        to:
          type: array
          items: { type: string }
          minItems: 1

    SmtpSecurity:
      type: string
      description: >
        Connection encryption. none = plain text; starttls = upgrade with STARTTLS after connecting (fails if the server does not offer it);
        tls = TLS from the first byte (implicit TLS, usually port 465). starttls and tls verify the server certificate against the system trust store
      enum: [none, starttls, tls]
      x-enum-varnames: [SmtpSecurityNone, SmtpSecurityStarttls, SmtpSecurityTls] # pin the constant names, same as NotifyLanguage

    AlertWebhookUrl:
      type: object
      required: [label, url]
      properties:
        label: { type: string, example: 'ops-monitor' }
        url: { type: string, example: 'https://monitor.org-a.internal/alertmanager' }

    TelegramSettings:
      type: object
      description: Telegram settings for alert notifications. botToken is accepted only on PUT / test and never returned by GET
      required: [chatId]
      properties:
        botToken: { type: string, format: password, nullable: true, example: '123456:ABC-DEF...' }
        chatId: { type: integer, format: int64, example: -1001234567890, description: 'Usually negative for groups' }
        messageThreadId: { type: integer, format: int64, nullable: true, description: 'Topic within the group (optional)' }

    SlackSettings:
      type: object
      description: Slack settings for alert notifications (incoming webhook). webhookUrl is accepted only on PUT / test and never returned by GET (the URL itself is the credential); GET returning this object means Slack is enabled
      properties:
        webhookUrl: { type: string, format: password, nullable: true, example: 'https://hooks.slack.com/services/T000/B000/XXXX' }

    AlertSettings:
      type: object
      description: Alert notification channel settings. The platform's own Alertmanager webhook receiver (which feeds GET /alerts) is always on and not configured here.
      required: [webhookUrls, locale, customCa]
      properties:
        locale: { $ref: '#/components/schemas/AlertLocaleView' }
        customCa:
          type: boolean
          readOnly: true
          description: The deployment sets SMTP_CA_FILE, so STARTTLS and TLS trust only the CA certificates in that file (for alert mail and password mail alike)
        smtp:
          allOf: [{ $ref: '#/components/schemas/SmtpSettings' }]
          nullable: true
          description: Email notifications are disabled when unset
        telegram:
          allOf: [{ $ref: '#/components/schemas/TelegramSettings' }]
          nullable: true
          description: Telegram notifications are disabled when unset
        slack:
          allOf: [{ $ref: '#/components/schemas/SlackSettings' }]
          nullable: true
          description: Slack notifications are disabled when unset
        webhookUrls:
          type: array
          items: { $ref: '#/components/schemas/AlertWebhookUrl' }

    NotifyLanguage:
      type: string
      description: Language of alert notifications and of the default rules' text
      enum: [zh, en]
      x-enum-varnames: [NotifyLanguageZh, NotifyLanguageEn] # pin the constant names: oapi-codegen's default naming drifts as same-named enums are added or removed

    AlertLocale:
      type: object
      description: >
        Language and time zone of alert notifications, shared by every channel. New installs start with en and an
        empty time zone, which follows the platform host's zone.
      required: [language, timezone]
      properties:
        language: { $ref: '#/components/schemas/NotifyLanguage' }
        timezone: { type: string, example: Asia/Taipei, description: 'IANA time zone name; notification times are shown in this zone, followed by its name. Empty = follow the platform host (its TZ; UTC when the host zone is unknown)' }

    AlertLocaleView:
      type: object
      description: The stored locale plus the zone notifications actually use
      required: [language, timezone, effectiveTimezone]
      properties:
        language: { $ref: '#/components/schemas/NotifyLanguage' }
        timezone: { type: string, example: '', description: 'As stored; empty = follow the platform host' }
        effectiveTimezone: { type: string, example: Asia/Taipei, description: 'The IANA zone notification times are shown in: timezone, or the host zone when timezone is empty' }

    AlertRuleOperator:
      type: string
      enum: [gt, lt, gte, lte]

    AlertRuleDuration:
      type: string
      description: >
        How long the condition must hold before firing (an allowlist; free-form PromQL duration syntax is not accepted). 0s = immediately (fires on the next evaluation after the condition holds).
        Also the allowed values for keepFiringFor (0s = no wait)
      enum: ['0s', '1m', '2m', '5m', '10m', '30m', '1h']

    AlertRuleKind:
      type: string
      description: >
        threshold = metric threshold rule (all user-added rules are this kind); metric/operator/threshold/nodeId can be changed.
        The others are default rules whose conditions are hard-coded in the platform, and only name, enabled, forDuration, keepFiringFor and severity can be changed - platform_down (the platform itself cannot be scraped),
        node_offline (agent offline), besu_metrics_down (agent up but Besu metrics cannot be scraped),
        validators_missing (some validators are not producing blocks but the chain still is), quorum_lost (more validators than the fault tolerance are not producing and the chain has stopped producing blocks).
        chain_slow (time since the last block exceeds threshold times the normal block time) can additionally change threshold (at least 1).
        chain_slow, validators_missing and quorum_lost apply to the whole chain, not to individual nodes.
      enum: [threshold, platform_down, node_offline, besu_metrics_down, chain_slow, validators_missing, quorum_lost]
      x-enum-varnames: [AlertRuleKindThreshold, AlertRuleKindPlatformDown, AlertRuleKindNodeOffline, AlertRuleKindBesuMetricsDown, AlertRuleKindChainSlow, AlertRuleKindValidatorsMissing, AlertRuleKindQuorumLost] # pin the constant names, same as AlertStatus

    AlertRuleCreateRequest:
      type: object
      description: >
        Create/update payload for a user-defined alert rule. Raw PromQL is deliberately not accepted: the backend builds the
        Prometheus rule from these structured fields using an allowlist, so one broken expression cannot take down the whole rule file.
      required: [name, metric, operator, threshold, forDuration, severity]
      properties:
        name: { type: string, example: 'node-a1 CPU high' }
        metric: { $ref: '#/components/schemas/MetricId' }
        nodeId: { type: string, nullable: true, description: 'Omitted = whole fleet (evaluated separately for each of our nodes)' }
        operator: { $ref: '#/components/schemas/AlertRuleOperator' }
        threshold: { type: number, example: 80 }
        forDuration: { $ref: '#/components/schemas/AlertRuleDuration' }
        severity: { type: string, enum: [critical, warning] }
        enabled: { type: boolean, default: true }
        keepFiringFor:
          allOf: [{ $ref: '#/components/schemas/AlertRuleDuration' }]
          description: How long the condition must stay false before the alert counts as resolved (debounce, maps to Prometheus keep_firing_for); 0s = no wait. Omitted = 0s
        clearThreshold:
          type: number
          nullable: true
          description: >
            Resolve threshold for threshold rules (dual-threshold debounce). Firing uses threshold; resolving requires crossing back past clearThreshold, e.g. fire at > 90, resolve at ≤ 85.
            Must not exceed threshold for gt/gte, nor be below it for lt/lte. Omitted = same as threshold

    AlertRuleUpdateRequest:
      type: object
      description: >
        Update payload. For kind=threshold, metric/operator/threshold are required; for kind=chain_slow, threshold is required (a multiplier, at least 1)
        and metric/operator/nodeId are not accepted. Other kinds have fixed conditions, and sending metric/operator/threshold/nodeId returns 400.
      required: [name, forDuration, severity]
      properties:
        name: { type: string }
        metric: { $ref: '#/components/schemas/MetricId' }
        nodeId: { type: string, nullable: true, description: 'Omitted = whole fleet' }
        operator: { $ref: '#/components/schemas/AlertRuleOperator' }
        threshold: { type: number }
        forDuration: { $ref: '#/components/schemas/AlertRuleDuration' }
        severity: { type: string, enum: [critical, warning] }
        enabled: { type: boolean, default: true }
        keepFiringFor:
          allOf: [{ $ref: '#/components/schemas/AlertRuleDuration' }]
          description: How long the condition must stay false before the alert counts as resolved (debounce, maps to Prometheus keep_firing_for); 0s = no wait. Omitted = unchanged
        clearThreshold:
          type: number
          nullable: true
          description: >
            Resolve threshold for threshold rules (dual-threshold debounce). Firing uses threshold; resolving requires crossing back past clearThreshold, e.g. fire at > 90, resolve at ≤ 85.
            Must not exceed threshold for gt/gte, nor be below it for lt/lte. Omitted = unchanged; if a new threshold crosses the existing resolve threshold, the resolve threshold resets to threshold
            (to drop the dual threshold, send the same value as threshold). Returns 400 for rules with fixed conditions

    AlertRule:
      type: object
      description: >
        An alert rule. Default rules are created by the platform at startup; like user-added rules they can be edited and disabled, but not deleted. User-added rules can be deleted in Enterprise.
        metric/operator/threshold/nodeId/clearThreshold exist only for kind=threshold; kind=chain_slow has only threshold (a multiplier).
      required: [id, kind, isDefault, alertname, name, forDuration, keepFiringFor, severity, enabled, createdBy, updatedBy, createdAt, updatedAt]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/AlertRuleKind' }
        isDefault: { type: boolean, description: 'Default rule (restore-defaults resets it to default values). For default threshold rules, metric/operator/nodeId are fixed and only the threshold can change' }
        alertname: { type: string, description: 'Name of the alert when it fires (matches Alert.alertname)', example: NodeCpuHigh }
        name: { type: string, example: NodeCpuHigh }
        metric: { $ref: '#/components/schemas/MetricId' }
        nodeId: { type: string, nullable: true }
        operator: { $ref: '#/components/schemas/AlertRuleOperator' }
        threshold: { type: number }
        forDuration: { $ref: '#/components/schemas/AlertRuleDuration' }
        keepFiringFor: { $ref: '#/components/schemas/AlertRuleDuration' }
        clearThreshold: { type: number, nullable: true, description: 'Resolve threshold; null = same as threshold' }
        severity: { type: string, enum: [critical, warning] }
        enabled: { type: boolean }
        createdBy: { type: string, description: 'Display name of the user who created it (for auditing); system for default rules created at startup, the user who restored defaults for one recreated by a restore' }
        updatedBy: { type: string, description: 'Display name of the user who last edited it or restored defaults; system for a default rule nobody has touched' }
        createdAt: { $ref: '#/components/schemas/Timestamp' }
        updatedAt: { $ref: '#/components/schemas/Timestamp' }

    PolicyApplyNodeResult:
      type: object
      description: Result of comparing one node's account allowlist with the organization policy.
      required: [nodeId, state]
      properties:
        nodeId: { type: string }
        state:
          type: string
          description: >
            Compared against this node's effective list ((uses shared list ? shared list : empty) ∪ directly added addresses).
            in_sync = the node's allowlist matches the policy; drift = it does not (on PUT, the read-back after sending still differs; on GET, someone changed it on the node);
            disabled = the node has no account allowlist enabled (PERM namespace off or allowlist file not enabled; see error);
            unreachable = the node is offline or cannot be reached (see error);
            rejected = the node is reachable but Besu refused to read or write the allowlist (e.g. the permissions file is not writable); error is Besu's original message.
          enum: [in_sync, drift, disabled, unreachable, rejected]
          x-enum-varnames: [PolicyApplyInSync, PolicyApplyDrift, PolicyApplyDisabled, PolicyApplyUnreachable, PolicyApplyRejected] # pin the constant names: oapi-codegen's default naming drifts as same-named enums are added or removed
        error: { type: string, nullable: true, description: 'English description of the failure (for developers and logs); the UI displays reason' }
        reason:
          allOf: [{ $ref: '#/components/schemas/ErrorReason' }]
          nullable: true
          description: Failure reason code (same as Error.reason; the UI translates it into the user's language)
        params:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: Variable values in the reason message
        currentAllowlist:
          type: array
          nullable: true
          items: { type: string }
          description: The node's current account allowlist (on GET, from the platform's latest collection round; on PUT, the read-back after sending); null when it could not be read. Used by "Import from nodes" on first use.
    PermissioningSaveResult:
      type: object
      required: [policyRevision, nodes]
      properties:
        policyRevision: { type: integer, format: int64 }
        nodes: { type: array, items: { $ref: '#/components/schemas/PolicyApplyNodeResult' } }
    NodeNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          nullable: true
          maxLength: 64
          description: Display name; null or an empty string clears it and the UI shows the node id instead
          example: Taipei primary validator
    NodePortsRequest:
      type: object
      required: [rpcPort, metricsPort]
      properties:
        rpcPort: { type: integer, minimum: 1, maximum: 65535, example: 8545 }
        metricsPort: { type: integer, minimum: 1, maximum: 65535, example: 9545 }
    NodeLogLevelRequest:
      type: object
      required: [level]
      properties:
        level:
          type: string
          enum: ['OFF', FATAL, ERROR, WARN, INFO, DEBUG, TRACE, ALL]
          x-enum-varnames: [LogLevelOff, LogLevelFatal, LogLevelError, LogLevelWarn, LogLevelInfo, LogLevelDebug, LogLevelTrace, LogLevelAll] # pin the constant names: oapi-codegen's default naming drifts as same-named enums are added or removed

    PermissioningPolicy:
      type: object
      description: >
        Organization-level Besu account allowlist. accountsAllowlist is the shared list, applied to nodes with "Use shared list" turned on;
        each node's effective list = (uses shared list ? shared list : empty) ∪ the addresses added to that node directly (see custom). There is no enable switch:
        whether the allowlist is enabled is decided by the node's startup options, and the platform only detects it (see nodes for per-node results).
        nodes and custom are read-only and may be omitted from requests; if sent they are ignored, whatever their content.
      required: [accountsAllowlist, revision]
      properties:
        revision:
          type: integer
          format: int64
          description: List revision. On PUT, send the revision shown on screen; if it differs from the current one, 409 is returned (someone else saved first) so their changes are not overwritten
        accountsAllowlist:
          type: array
          items: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
          description: Account addresses allowed to send transactions (0x...)
        nodes:
          type: array
          readOnly: true
          description: Returned on GET - each node's current allowlist compared with the policy (from the platform's latest collection round, taken every 10 seconds; until the first round after a save, the list the platform read back from each node while saving). Ignored on PUT.
          items: { $ref: '#/components/schemas/PolicyApplyNodeResult' }
        custom:
          type: array
          readOnly: true
          description: Returned on GET - nodes that have directly added addresses or have the shared list turned off (the latter, when it has no addresses, has revision 0 and an empty list). Ignored on PUT.
          items: { $ref: '#/components/schemas/NodeAllowlist' }

    NodeAllowlist:
      type: object
      description: Addresses added directly to one node (on top of the shared list) and its use-shared-list switch.
      required: [nodeId, revision, accountsAllowlist, useShared]
      properties:
        nodeId: { type: string }
        revision: { type: integer, format: int64, description: 'Revision of this list, sent back when saving; 0 when there are no directly added addresses' }
        accountsAllowlist:
          type: array
          items: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        useShared: { type: boolean, description: 'Whether this node uses the shared list' }

    NodeAllowlistSharedRequest:
      type: object
      required: [useShared]
      properties:
        useShared: { type: boolean }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, description: 'At least 12 characters and at most 72 bytes; must not contain the username, be a common password, or equal the current password. A rejected password answers 400 with the rule it broke as the reason' }

    LoginResult:
      type: string
      enum: [success, failure]
      x-enum-varnames: [LoginResultSuccess, LoginResultFailure]

    LoginFailReason:
      type: string
