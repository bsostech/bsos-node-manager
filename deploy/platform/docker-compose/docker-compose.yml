# One-shot platform stack: Postgres + Platform Server (serves the frontend same-origin and terminates TLS itself, see backend/internal/webapp).
# One shot: ./up.sh (generates server.env and builds first); or manually `docker compose up -d --build`.
# Edition: up.sh writes EDITION / SERVER_IMAGE into .env in this directory (Enterprise if backend/enterprise/ exists); without an up.sh run it builds Core.
# Database password: up.sh generates POSTGRES_PASSWORD into the same .env on its first run. Without it compose refuses to start
# rather than fall back to a shared default (this applies to every docker compose command, since compose reads the whole file);
# when setting it yourself, use URL-safe characters with no #, $ or quotes (it goes into DATABASE_URL).
# build context = repo root (backend/Dockerfile is a multi-stage build that needs both backend/ and frontend/).
#
# Variables of the form ${VAR:-default} let several stacks run on one host (EDITION / SERVER_IMAGE are passed by up.sh).
name: bsos-node-manager

services:
  postgres:
    image: postgres:16.15-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: ${SIM_PREFIX:-bsos-node-manager}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: besu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set; run ./up.sh once (it writes a random one to .env) or set it yourself}
      POSTGRES_DB: besu_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U besu -d besu_manager"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port, and only on the db network: Prometheus and Alertmanager cannot reach it
    networks:
      db: {}

  server:
    build:
      context: ../../..                    # repo root (see above); Dockerfile path below
      dockerfile: backend/Dockerfile
      args:
        EDITION: ${EDITION:-core}
        VERSION: ${BUILD_VERSION:-dev}        # written to .env by up.sh (deploy/version.sh); not plain VERSION, which shells often export
        RELEASE_DATE: ${BUILD_RELEASE_DATE:-}
    image: ${SERVER_IMAGE:-bsos-node-manager}   # the Enterprise edition is bsos-node-manager-enterprise
    container_name: ${SIM_PREFIX:-bsos-node-manager}-server
    restart: unless-stopped
    env_file:
      - ${SERVER_ENV_FILE:-server.env}   # ORG_ID / CA_MASTER_KEY / TLS_MODE / SITE_DOMAIN ... (generated by up.sh from .example)
    environment:
      # compose network overrides: DB points at the postgres service, agent binary at the mounted directory
      DATABASE_URL: postgres://besu:${POSTGRES_PASSWORD}@postgres:5432/besu_manager   # postgres above already requires the variable
      AGENT_BINARY_DIR: /agent-bin
      # Real monitoring time series: query this stack's Prometheus; sd_token is written to a shared volume for Prometheus to read
      PROMETHEUS_URL: http://prometheus:9090
      SD_TOKEN_DIR: /sd-token
      # The Prometheus container runs as nobody (gid 65534); the key is chowned to this gid + 0640 so it can read what server (root) writes.
      SD_TOKEN_GID: "65534"
      ACME_CACHE_DIR: /acme-cache          # autocert certificate cache for TLS_MODE=acme (must persist, see the volume below)
      SITE_CERT_FILE: /certs/server.crt    # read from here for TLS_MODE=manual (up.sh installs --cert/--key into ./certs)
      SITE_KEY_FILE: /certs/server.key
      # Alert notification settings: the platform renders alert_settings into alertmanager.yml
      # in a shared volume that Alertmanager mounts read-only; after a settings change it calls /-/reload to hot-reload.
      ALERTMANAGER_CONFIG_DIR: /alertmanager-config
      ALERTMANAGER_CONFIG_GID: "65534"     # the alertmanager container is also nobody (like Prometheus), see the alertmanager service
      ALERTMANAGER_RELOAD_URL: http://alertmanager:9093/-/reload
      # User-defined alert rules: the platform renders custom_alert_rules into a Prometheus rule group,
      # which Prometheus reads via a glob (see rule_files in prometheus.yml), not a fixed file name. The volume is empty right after creation,
      # and Prometheus must still start normally then, not fail entirely because one specific file is missing.
      PROM_RULES_DIR: /prom-rules-config
      PROM_RELOAD_URL: http://prometheus:9090/-/reload
    volumes:
      # ,z on host bind mounts: with Docker's SELinux support on, a container cannot read files labeled for the host
      # (user_home_t). z relabels them for containers; Docker ignores it where SELinux is off.
      - ./agent-bin:/agent-bin:ro,z       # holds besu-agent-linux-amd64/-arm64 for node install.sh to download
      - ./certs:/certs:ro,z               # server.crt / server.key for TLS_MODE=manual (signed by a public CA or an internal company CA)
      - acme-cache:/acme-cache            # autocert certificate persistence for TLS_MODE=acme (across restarts/renewals)
      - sd-token:/sd-token                # platform writes sd_token (rw); Prometheus mounts the same volume read-only
      - alertmanager-config:/alertmanager-config  # platform writes alertmanager.yml (rw); Alertmanager mounts the same volume read-only
      - prom-rules-config:/prom-rules-config      # platform writes custom-rules.yml (rw); Prometheus mounts the same volume read-only
    networks:
      default: {}
      db: {}                              # the only service besides postgres on this network
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"              # website (plain HTTP mode; in acme/manual mode only redirects 80->443)
      - "${WEB_TLS_PORT:-443}:443"        # website (TLS, acme/manual mode)
      - "${AGENT_PORT:-8443}:8443"        # agent join / control mTLS (must be reachable from nodes)
      # Cross-org read-only 8544 is not published by default: to open it, add it in docker-compose.override.yml, see README
    healthcheck:
      # Hits the internal :8080/healthz, not the public :80. In acme/manual mode :80 only 301-redirects to the external domain;
      # if the healthcheck follows the redirect (the earlier wget --spider did), it gets stuck on outbound connections/cert validation (staging certs and internal CAs are not trusted),
      # never passes, so alertmanager waits forever and startup fails outright (worse than the permission denied
      # it replaced). :8080 has no published port and does not depend on TLS_MODE, and it also starts listening only after
      # alertSvc.LoadAndApply() (main.go): once this check passes, alertmanager.yml has already been written into
      # the alertmanager-config volume. alertmanager's depends_on relies on this condition; otherwise it mounts the
      # empty volume first and copies its own image's built-in /etc/alertmanager/alertmanager.yml (nobody:nobody)
      # into it, displacing the version the platform writes, and the platform gets permission denied forever after (the failure the healthcheck ordering prevents).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      # A longer window than postgres's healthcheck (retries:10): server startup waits for postgres to be healthy
      # + runs migrations + initializes the CA, much slower than pg_isready.
      retries: 20
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2         # pinned to a recent version; scrapes now go through the platform proxy, so hot-reloading client certs is no longer needed
    container_name: ${SIM_PREFIX:-bsos-node-manager}-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d  # monitoring charts show only 24h; 15d leaves room for investigating issues
      # Active alerts sent to Alertmanager carry a validity of 4 x resend-delay. With the default 1m (about 4 minutes), once Prometheus goes down,
      # Alertmanager treats the alerts as resolved after about 4 minutes and sends "resolved" notices; 15m (about 1 hour) matches Prometheus's own
      # for-outage-tolerance for restoring alert state (default 1h). Normal resolutions are sent by Prometheus itself and are unaffected.
      - --rules.alert.resend-delay=15m
      # Lets the platform call /-/reload after changing custom alert rules. This flag also enables /-/quit (any container on the internal network can shut down
      # Prometheus); the risk is confined to the container network (9090 is not published).
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./rules.yml:/etc/prometheus/rules.yml:ro,z
      # Custom rules: read rules.d/ via a glob (not a fixed file name). Right after the volume is created and before the platform writes to it the directory is empty;
      # a glob matching no files is valid, so Prometheus still starts normally instead of crash looping over a missing file name.
      - prom-rules-config:/etc/prometheus/rules.d:ro
      # sd-token: server writes sd_token (0640 + gid 65534); Prometheus (nobody) mounts the same volume read-only.
      - sd-token:/sd-token:ro
      - promdata:/prometheus
    depends_on:
      - server
    # 9090 is not published: only the server on the same network queries it (PROMETHEUS_URL=http://prometheus:9090)

  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    container_name: ${SIM_PREFIX:-bsos-node-manager}-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/alertmanager-config/alertmanager.yml
      - --storage.path=/alertmanager
      # Note: Alertmanager enables the /-/reload endpoint by default, unlike Prometheus, which needs --web.enable-lifecycle
      # (that flag does not exist in Alertmanager; adding it keeps it from starting).
    volumes:
      # alertmanager.yml is rendered and written dynamically by the platform (rewritten + /-/reload when SMTP/webhook settings change),
      # no longer a static host file (the committed alertmanager.yml is kept as a reference for self-managed Alertmanager and local promtool checks).
      #
      # Mounted at /alertmanager-config, not the official default /etc/alertmanager (why, see below).
      # This volume is an empty named volume mounted by both containers. When an empty volume is mounted for the first time, Docker
      # copies in the entire content of the matching path from that container's image. It happens only once: whoever is created first wins with its content (and ownership),
      # and "first" means when the container is *created*, which is not protected by depends_on/condition:service_healthy and similar
      # mechanisms that only control *start order* (tested: compose creates all services almost at once; only the start time is held back by condition).
      # The official prom/alertmanager image ships a real sample config in /etc/alertmanager (nobody:nobody),
      # while the server image only creates an empty directory at /alertmanager-config (besu:besu, see backend/Dockerfile).
      # When mounted at /etc/alertmanager, if alertmanager is created first, the volume is taken over by its own nobody:nobody
      # file and server (besu) can never write to it afterwards. Mounting at /alertmanager-config instead: this path
      # does not exist at all in the official alertmanager image (nothing to copy), so only the server side has real content;
      # whoever is created first, ownership is always besu:besu and the race is gone at the root (same trick as /sd-token: see the
      # volume below, which server and prometheus share at the same path; the prometheus image has nothing there either, and it has never caused trouble).
      - alertmanager-config:/alertmanager-config:ro
      - alertmanagerdata:/alertmanager
      # The platform receiver calls server:8080/alerts/webhook with the SD_TOKEN bearer, reusing the sd_token server writes into this volume
      - sd-token:/sd-token:ro
    depends_on:
      server:
        # Only avoids transient alertmanager crash-loop noise when server has never written the config file;
        # no longer what keeps volume ownership from being taken (that is solved by the mount path choice above).
        condition: service_healthy
    # 9093 is not published: only Prometheus on the same network sends alerts here, plus the platform's hot reloads

networks:
  db:
    internal: true                        # no route out; postgres needs none

volumes:
  pgdata:
  sd-token:
  promdata:
  alertmanagerdata:
  alertmanager-config:
  prom-rules-config:
  acme-cache:
